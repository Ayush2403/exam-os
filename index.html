.tag-future{color:var(--text-3);background:var(--surface-2);border:1px solid var(--border);font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);white-space:nowrap}
.toolbar{position:sticky;top:60px;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);padding:12px 0;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--border);margin-bottom:8px}

.subj-group{margin-top:14px}

.row-actions{display:flex;gap:2px;opacity:0;transition:opacity .2s}

.mini-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--text-3);transition:all .2s;flex-shrink:0}

.page-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}

.page-tab{padding:8px 16px;border-radius:var(--r-pill);font-size:13px;font-weight:600;color:var(--text-2);background:var(--surface);border:1px solid var(--border);transition:all .22s var(--ease-out);cursor:pointer;white-space:nowrap;flex-shrink:0;min-height:36px;display:inline-flex;align-items:center}

.sess-card{display:flex;flex-direction:column;gap:10px}

.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.bcol{background:color-mix(in srgb,var(--text) 2%,transparent);border:1px solid var(--border);border-radius:var(--r);padding:12px;min-height:120px}
.bcol-h{display:flex;align-items:center;gap:8px;padding:2px 6px 12px;font-size:12.5px;font-weight:700;letter-spacing:.01em}
.bcol-h .cnt{margin-left:auto;font-size:11px;color:var(--text-3);background:var(--surface-2);border-radius:var(--r-pill);padding:2px 8px}
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 13px;margin-bottom:9px;transition:all .3s var(--ease-out)}

.task-card .tm{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}

.goal-bar{position:relative;height:10px;border-radius:99px;background:color-mix(in srgb,var(--text) 8%,transparent);overflow:visible;margin:20px 0 8px}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}

.mcell.zero{opacity:.35}
.hm-wrap{overflow-x:auto;padding:4px 0}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;min-width:max-content}
.hm i{width:12px;height:12px;border-radius:3px;background:color-mix(in srgb,var(--text) 6%,transparent);display:block;cursor:pointer;transition:all .2s}

.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:4px;height:140px}
.ws-day{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}

.sett-section{border-top:1px solid var(--border);padding-top:16px;margin-top:16px}

.tax-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px;max-height:280px;overflow-y:auto}

.tax-row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.theme-sw{border:2px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;transition:all .25s var(--ease-out);background:var(--surface)}

#toast-root{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:calc(100vw - 24px)}
.toast{background:var(--surface-2);border:1px solid var(--border-2);border-radius:12px;padding:11px 18px;font-size:13.5px;font-weight:600;box-shadow:0 16px 48px rgba(0,0,0,.4);animation:toastIn .4s var(--ease-out);display:flex;align-items:center;gap:9px;max-width:100%;backdrop-filter:blur(10px)}

.empty{text-align:center;padding:36px 20px;color:var(--text-3)}
.empty .ic{font-size:32px;margin-bottom:10px}

.urgent-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;transition:background .2s}

.urgent-item .t{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.weak-score{font-size:11px;font-weight:800;color:#fca5a5;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.3);padding:2px 7px;border-radius:var(--r-pill);min-width:34px;text-align:center;font-variant-numeric:tabular-nums;flex-shrink:0}

.detail-block{border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;margin-bottom:10px;background:var(--surface)}

.detail-block h5 .cnt{margin-left:auto;font-size:11px;background:var(--surface-2);padding:2px 8px;border-radius:99px;color:var(--text-2)}
.detail-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;font-size:12.5px}
.detail-row:hover{background:var(--surface-2)}

.welcome-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-top:20px}

.welcome-card .wc-body{flex:1;min-width:0}

.welcome-card .wc-acts{display:flex;gap:8px;flex-shrink:0}
footer.app-foot{margin-top:36px;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-3);flex-wrap:wrap;gap:10px}

const topicById=id=>S.syllabus.find(t=>t.id===id)||null;
function nextReview(s){if(s.stage==="Mastered")return null;if(!s.lastReviewed)return todayISO();const i=STAGES.indexOf(s.stage);return addDays(s.lastReviewed,INTERVALS[i<0?0:i]);}
function reviewState(s){if(s.stage==="Mastered")return{st:"mastered",nr:null};const nr=nextReview(s),d=diffD(nr,todayISO());if(!s.lastReviewed)return{st:"new",nr};if(d<0)return{st:"overdue",nr,days:-d};if(d===0)return{st:"today",nr};return{st:"future",nr,days:d};}
const isDue=s=>["overdue","today","new"].indexOf(reviewState(s).st)>-1;
function dueSessions(){return S.sessions.filter(isDue).sort((a,b)=>{const ra=reviewState(a),rb=reviewState(b);const da=ra.st==="overdue"?-ra.days-1000:(ra.st==="new"?-500:0),db=rb.st==="overdue"?-rb.days-1000:(rb.st==="new"?-500:0);return da-db||a.name.localeCompare(b.name);});}
function completeReview(id){snapshot();const s=S.sessions.find(x=>x.id===id);if(!s)return;const i=STAGES.indexOf(s.stage);if(i>=STAGES.length-1){toast("Already mastered 🏆");return;}s.lastReviewed=todayISO();s.stage=STAGES[i+1];saveLocal();const nr=nextReview(s);toast(s.stage==="Mastered"?"🏆 Mastered!":"✓ "+s.stage,s.stage==="Mastered"?esc(s.name):"Next: "+fmtD(nr));rerender();}
function studyStreak(){const set=new Set();S.sessions.forEach(s=>{if(s.lastReviewed)set.add(s.lastReviewed);if(s.logDate)set.add(s.logDate);});S.mocks.forEach(m=>{if(m.date)set.add(m.date);});(S.focusLog||[]).forEach(f=>{if(f.startedAt)set.add(f.startedAt.slice(0,10));});Object.keys(S.habits||{}).forEach(k=>{if(Object.values(S.habits[k]).some(v=>v))set.add(k);});let streak=0,cur=todayISO();if(!set.has(cur))cur=addDays(cur,-1);while(set.has(cur)){streak++;cur=addDays(cur,-1);}return streak;}
function weaknessScore(t){const errs=S.errors.filter(e=>e.topicId===t.id).length;const mw=S.mocks.filter(m=>(m.weak||[]).indexOf(t.id)>-1).length;let s=errs*10+mw*15;if(t.priority==="Critical")s+=20;else if(t.priority==="High")s+=10;if(t.weightage==="High")s+=15;const st={"Not started":5,"Learning":15,"Practicing":10,"Reviewing":5,"Mastered":-50};s+=st[t.status]||0;if(t.exams.indexOf("CGL")>-1)s+=10;return s;}
function weakTopics(limit){return S.syllabus.filter(t=>t.status!=="Mastered").map(t=>({t:t,score:weaknessScore(t)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,limit||10);}
function moveTopic(id,dir){const t=topicById(id);if(!t)return;const sibs=S.syllabus.filter(x=>x.subject===t.subject);const idx=sibs.indexOf(t);const ti=idx+dir;if(ti<0||ti>=sibs.length)return;const other=sibs[ti];const i1=S.syllabus.indexOf(t),i2=S.syllabus.indexOf(other);snapshot();const tmp=S.syllabus[i1];S.syllabus[i1]=S.syllabus[i2];S.syllabus[i2]=tmp;saveLocal();rerender();}
function getSubjectOrder(){if(!S.subjectOrder)S.subjectOrder=[];const used=[...new Set(S.syllabus.map(t=>t.subject))];used.forEach(s=>{if(S.subjectOrder.indexOf(s)<0)S.subjectOrder.push(s);});S.subjectOrder=S.subjectOrder.filter(s=>used.indexOf(s)>-1);used.forEach(s=>{if(S.subjectOrder.indexOf(s)<0)S.subjectOrder.push(s);});return S.subjectOrder.slice();}
function moveSubject(sub,dir){const order=getSubjectOrder();const idx=order.indexOf(sub);const ti=idx+dir;if(ti<0||ti>=order.length){toast("Already at the "+(dir<0?"top":"bottom"));return;}snapshot();const tmp=order[idx];order[idx]=order[ti];order[ti]=tmp;S.subjectOrder=order;saveLocal();rerender();toast(dir<0?"Moved up":"Moved down");}

let TMR={running:false,startedAt:null,label:"",taskId:null,topicId:null,tick:null};
function timerStart(opts){if(TMR.running){if(!confirm("Timer running. Stop it?"))return;timerStop(true);}TMR={running:true,startedAt:Date.now(),label:opts.label||"Focus",taskId:opts.taskId||null,topicId:opts.topicId||null,tick:setInterval(updateTimerUI,1000)};updateTimerUI();renderTimerWidget();}
function timerStop(silent){if(!TMR.running)return;clearInterval(TMR.tick);const mins=Math.round((Date.now()-TMR.startedAt)/60000);if(mins>=1){snapshot();S.focusLog.push({id:uid("f"),label:TMR.label,taskId:TMR.taskId,topicId:TMR.topicId,startedAt:new Date(TMR.startedAt).toISOString(),endedAt:new Date().toISOString(),minutes:mins});saveLocal();if(!silent)toast("⏱ Logged "+mins+" min");rerender();}else if(!silent)toast("Too short");TMR={running:false,startedAt:null,label:"",taskId:null,topicId:null,tick:null};updateTimerUI();renderTimerWidget();}
function updateTimerUI(){const el=$("#timer-pill");if(!el)return;if(TMR.running){const sec=Math.floor((Date.now()-TMR.startedAt)/1000);el.className="timer-pill running";el.innerHTML="⏹ "+String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")+' <span class="tmr-label">· '+esc(TMR.label).slice(0,14)+'</span>';}else{el.className="timer-pill";el.innerHTML='⏱ <span class="tmr-label">Focus</span>';}}
function renderTimerWidget(){const w=$("#timer-widget");if(!w)return;w.innerHTML=TMR.running?'<div class="card" style="border-color:rgba(239,68,68,.4);margin-bottom:14px"><div class="card-h"><h2>⏱ Focus running</h2></div><div class="muted small">'+esc(TMR.label)+'</div><div class="chips" style="margin-top:10px"><button class="btn green sm" data-action="timer-stop">Stop &amp; save</button><button class="btn ghost sm" data-action="timer-cancel">Discard</button></div></div>':"";}
function focusStats(){const wkStart=iso(mondayOf(0));const logs=(S.focusLog||[]).filter(f=>f.startedAt&&f.startedAt.slice(0,10)>=wkStart);const totalMin=logs.reduce((a,f)=>a+(f.minutes||0),0);const bySub={};logs.forEach(f=>{const t=f.topicId?topicById(f.topicId):null;const k=t?t.subject:"Other";bySub[k]=(bySub[k]||0)+(f.minutes||0);});return{totalMin,bySub,count:logs.length};}
function fmtMin(m){if(m<60)return m+"m";const h=Math.floor(m/60),r=m%60;return h+"h"+(r?" "+r+"m":"");}
function topicFocusMin(id){return(S.focusLog||[]).filter(f=>f.topicId===id).reduce((a,f)=>a+(f.minutes||0),0);}

function taxList(k){return(S.tax&&S.tax[k])||DEFAULT_TAX[k]||[];}
function taxAdd(k,v){if(!v||!v.trim())return;v=v.trim();if(taxList(k).indexOf(v)>-1)return;S.tax[k]=taxList(k).concat([v]);saveLocal();}
function taxRemove(k,v){S.tax[k]=taxList(k).filter(x=>x!==v);saveLocal();}
function statusPct(s){const st=taxList("statuses");const i=st.indexOf(s);if(i<0)return 0;if(st.length<=1)return 0;if(s==="Mastered")return 100;return Math.round((i/(st.length-1))*100);}
function statusColor(s){const map={"Not started":"#EF4444","Learning":"#EAB308","Practicing":"#3B82F6","Reviewing":"var(--accent)","Mastered":"#10B981"};if(map[s])return map[s];const p=["#71717A","#F59E0B","#3B82F6","var(--accent)","#10B981"];const i=taxList("statuses").indexOf(s);return p[Math.max(0,i)%p.length];}
function errColor(t){const m={"concept missed":"var(--accent)","forgot formula":"#3B82F6","calculation slip":"#EAB308","time trap":"#EC4899"};return m[t]||"var(--text-3)";}
function priClass(p){return p==="Critical"?"pri-critical":p==="High"?"pri-high":p==="Medium"?"pri-medium":p==="Low"?"pri-low":"";}
const wsColor=pct=>pct>=75?"#10B981":pct>=50?"var(--accent)":pct>=25?"#F59E0B":pct>0?"#EF4444":"transparent";

function toast(main,sub){const root=$("#toast-root");if(!root)return;const t=document.createElement("div");t.className="toast";t.innerHTML="<span>"+main+"</span>"+(sub?'<span class="sub">'+sub+"</span>":"");root.appendChild(t);setTimeout(()=>{t.classList.add("out");setTimeout(()=>t.remove(),400);},2800);}
let _modalSave=null;
function openModal(title,body,onSave,saveLabel){
  const r=$("#modal-root");if(!r)return;
  r.innerHTML='<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><h3>'+esc(title)+'</h3><div class="mbody">'+body+'</div><div class="modal-acts"><button class="btn ghost" data-mclose>Cancel</button><button class="btn primary" data-msave>'+esc(saveLabel||"Save")+'</button></div></div></div>';
  $$(".tpick",r).forEach(wirePicker);
  _modalSave=onSave;
  const cl=$("[data-mclose]",r);if(cl)cl.onclick=closeModal;
  const sv=$("[data-msave]",r);
  if(sv)sv.onclick=()=>{const vals=collectVals(r);if(_modalSave&&_modalSave(vals)===false)return;closeModal();};
  r.firstElementChild.addEventListener("mousedown",e=>{if(e.target.classList.contains("overlay"))closeModal();});
  document.addEventListener("keydown",escClose);
  const f=$(".modal .inp",r);if(f)setTimeout(()=>f.focus(),80);
}
function escClose(e){if(e.key==="Escape"){closeModal();closeSheet();}}
function closeModal(){const r=$("#modal-root");if(r)r.innerHTML="";_modalSave=null;document.removeEventListener("keydown",escClose);}
function openSheet(title,items){const r=$("#sheet-root");if(!r)return;r.innerHTML='<div class="sheet"><div class="sh-body"><div class="sh-handle"></div>'+(title?'<div style="font-family:\'Plus Jakarta Sans\',sans-serif;font-size:15px;font-weight:800;margin:0 6px 12px;letter-spacing:-.02em">'+esc(title)+'</div>':"")+items.map(it=>'<button class="sh-item" data-nav="'+it.id+'">'+ICONS[it.icon]+'<span>'+it.label+'</span></button>').join("")+'</div></div>';document.addEventListener("keydown",escClose);r.firstElementChild.addEventListener("mousedown",e=>{if(e.target.classList.contains("sheet"))closeSheet();});}
function closeSheet(){const r=$("#sheet-root");if(r)r.innerHTML="";document.removeEventListener("keydown",escClose);}
function collectVals(root){const v={};$$(".modal [name]",root).forEach(el=>{if(el.type==="checkbox"){if(!v[el.name])v[el.name]=[];if(el.checked)v[el.name].push(el.value);}else v[el.name]=el.value;});return v;}
function openConfirm(msg,onYes){openModal("Are you sure?",'<p class="muted small">'+esc(msg)+'</p>',()=>onYes(),"Confirm");const b=$("[data-msave]");if(b){b.classList.remove("primary");b.classList.add("danger");}}
function pickerHTML(name,selIds,multi){selIds=selIds||[];return'<div class="tpick" data-name="'+name+'" data-multi="'+(multi?1:0)+'"><input type="hidden" name="'+name+'" value=\''+esc(JSON.stringify(selIds))+'\'>'+(multi?'<div class="pick-chips"></div>':'')+'<input class="inp pick-search" placeholder="Search syllabus topic…" autocomplete="off"><div class="picker-list"></div></div>';}
function wirePicker(el){
  const multi=el.dataset.multi==="1",hidden=$("input[type=hidden]",el),search=$(".pick-search",el),list=$(".picker-list",el);
  const getSel=()=>{try{return JSON.parse(hidden.value);}catch(e){return[];}};
  const setSel=a=>{hidden.value=JSON.stringify(a);renderChips();renderList();};
  const renderChips=()=>{if(!multi)return;const c=$(".pick-chips",el);if(!c)return;c.innerHTML=getSel().map(id=>{const t=topicById(id);if(!t)return"";return'<span class="pill"><i class="dot" style="background:'+subjColor(t.subject)+'"></i><span>'+esc(t.topic)+'</span><span class="x" data-unpick="'+id+'">×</span></span>';}).join("");};
  const renderList=()=>{const q=search.value.toLowerCase(),sel=getSel();const m=S.syllabus.filter(t=>!q||t.topic.toLowerCase().indexOf(q)>-1).slice(0,30);list.innerHTML=m.length?m.map(t=>'<div class="pick-opt'+(sel.indexOf(t.id)>-1?" sel":"")+'" data-pick="'+t.id+'"><i class="sdot" style="background:'+subjColor(t.subject)+'"></i><span>'+esc(t.topic)+'</span><span class="tiny" style="margin-left:auto">'+esc(t.subject)+'</span></div>').join(""):'<div class="empty" style="padding:14px"><p>No topic found</p></div>';};
  search.addEventListener("input",renderList);
  list.addEventListener("click",e=>{const o=e.target.closest("[data-pick]");if(!o)return;const id=o.dataset.pick,sel=getSel();if(multi){setSel(sel.indexOf(id)>-1?sel.filter(x=>x!==id):sel.concat([id]));}else{setSel([id]);const t=topicById(id);search.value=t?t.topic:"";renderList();}});
  if(multi)el.addEventListener("click",e=>{const x=e.target.closest("[data-unpick]");if(x)setSel(getSel().filter(i=>i!==x.dataset.unpick));});
  renderChips();renderList();
}
const pickVals=v=>{try{return JSON.parse(v);}catch(e){return[];}};

function renderRoute(){
  try{
    const r=route(),n=NAV.find(x=>x.id===r)||NAV[0];
    const t=$("#page-title");if(t)t.textContent=n.title;
    $$("[data-nav]").forEach(b=>b.classList.toggle("active",b.dataset.nav===r));
    const sn=$("#streak-num");if(sn)sn.textContent=studyStreak();
    const dc=$("#date-chip");if(dc)dc.textContent=fmtDY(todayISO());

async function initFirebase(){if(fbReady)return true;if(!FBCFG.apiKey||!FBCFG.projectId)return false;if(!window.firebase){await loadScript("https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js");await loadScript("https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js");}if(!window.firebase)return false;if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(FBCFG);fbReady=true;return true;}
async function pushNow(silent){if(!S.sync.enabled||!S.sync.room)return;try{setSyncStatus("syncing");if(!await initFirebase()){setSyncStatus("error");if(!silent)toast("⚠️ Firebase not configured");return;}const db=firebase.firestore();const payload=JSON.parse(JSON.stringify(S));delete payload.sync;delete payload._lastSync;const now=new Date().toISOString();await db.collection("exam_os_rooms").doc(S.sync.room).set({data:payload,updatedAt:now});S._lastSync=now;lastSyncAt=now;store.set(KEY,JSON.stringify(S));setSyncStatus("synced");if(!silent)toast("☁️ Pushed");}catch(e){setSyncStatus("error");if(!silent)toast("⚠️ Sync failed",e.message);}}
function queueSync(){if(!S.sync.enabled||_applyingRemote)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>pushNow(true),2500);}
async function startSync(){
  if(!S.sync.enabled||!S.sync.room){setSyncStatus("off");if(syncUnsub){syncUnsub();syncUnsub=null;}return;}
  try{
    setSyncStatus("connecting");
    if(!await initFirebase()){setSyncStatus("error");toast("⚠️ Paste Firebase config in Settings");return;}
    const db=firebase.firestore();const ref=db.collection("exam_os_rooms").doc(S.sync.room);
    const snap=await ref.get();
    if(snap.exists){
      const remote=snap.data();
      if(remote&&remote.data&&remote.updatedAt){
        if(!S._lastSync){openConfirm("Cloud already has data for this room. Replace THIS device's data with cloud?",()=>{_applyingRemote=true;Object.keys(remote.data).forEach(k=>{S[k]=remote.data[k];});S._lastSync=remote.updatedAt;lastSyncAt=remote.updatedAt;S.sync={enabled:true,room:ref.id};_applyingRemote=false;applyTheme(S.settings.theme||"apex");store.set(KEY,JSON.stringify(S));rerender();toast("⬇ Pulled cloud");});}
        else if(remote.updatedAt>S._lastSync){_applyingRemote=true;Object.keys(remote.data).forEach(k=>{S[k]=remote.data[k];});S._lastSync=remote.updatedAt;lastSyncAt=remote.updatedAt;S.sync={enabled:true,room:ref.id};_applyingRemote=false;applyTheme(S.settings.theme||"apex");store.set(KEY,JSON.stringify(S));rerender();toast("⬇ Updated from cloud");}
      }
    }else await pushNow(true);
    if(syncUnsub)syncUnsub();
    syncUnsub=ref.onSnapshot(doc=>{
      if(!doc.exists||_applyingRemote)return;
      const d=doc.data();if(!d||!d.data||!d.updatedAt)return;
      if(!S._lastSync||d.updatedAt>S._lastSync){_applyingRemote=true;Object.keys(d.data).forEach(k=>{S[k]=d.data[k];});S._lastSync=d.updatedAt;lastSyncAt=d.updatedAt;S.sync={enabled:true,room:ref.id};_applyingRemote=false;applyTheme(S.settings.theme||"apex");store.set(KEY,JSON.stringify(S));rerender();setSyncStatus("synced");}
    });
    setSyncStatus("synced");
  }catch(e){setSyncStatus("error");console.error(e);toast("⚠️ Sync error",e.message);}
}
function stopSync(){if(syncUnsub){syncUnsub();syncUnsub=null;}setSyncStatus("off");}

function renderSylList(){

  const el=$("#syl-list");if(!el)return;

    const avg=Math.round(items.reduce((a,t)=>a+statusPct(t.status),0)/items.length);
    const closed=sf.closed[sub];

      +'<div class="subj-head" data-action="toggle-subj" data-id="'+esc(sub)+'">'

        +'<span class="tiny">'+avg+'%</span>'

          +'<button class="mini-icon" data-action="subj-up" data-id="'+esc(sub)+'" title="Move subject up" '+(isFirst?"disabled":"")+'>'+ICONS.up+'</button>'
          +'<button class="mini-icon" data-action="subj-down" data-id="'+esc(sub)+'" title="Move subject down" '+(isLast?"disabled":"")+'>'+ICONS.down+'</button>'

  const ms=S.mocks.filter(m=>m.date).sort((a,b)=>a.date<b.date?-1:1);
  if(!ms.length)return"";
  const W=680,H=240,PL=38,PR=16,PT=16,PB=30;
  const X=i=>ms.length===1?PL+(W-PL-PR)/2:PL+i*(W-PL-PR)/(ms.length-1);
  const Y=v=>PT+(100-Math.max(0,Math.min(100,+v||0)))*(H-PT-PB)/100;
  const grid=[0,25,50,75,100].map(v=>'<line x1="'+PL+'" y1="'+Y(v)+'" x2="'+(W-PR)+'" y2="'+Y(v)+'" stroke="color-mix(in srgb,var(--text) 6%,transparent)"/><text x="'+(PL-8)+'" y="'+(Y(v)+4)+'" fill="var(--text-3)" font-size="10" text-anchor="end">'+v+'</text>').join("");
  const xlab=ms.map((m,i)=>'<text x="'+X(i)+'" y="'+(H-8)+'" fill="var(--text-3)" font-size="10" text-anchor="middle">'+fmtD(m.date)+'</text>').join("");
  const line=(key,color)=>{const pts=ms.map((m,i)=>[X(i),Y(m[key])]);return'<polyline points="'+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+pts.map((p,i)=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" fill="var(--surface)" stroke="'+color+'" stroke-width="2.5"><title>'+esc(ms[i].title)+'</title></circle>').join("");};
  return'<svg viewBox="0 0 '+W+' '+H+'">'+grid+xlab+line("percentile","var(--accent)")+line("accuracy","#10B981")+'</svg>';
}

function viewHabitsMonth(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const last=new Date(y,m+1,0);
  const weeks=[];let cur=null;
  for(let d=1;d<=last.getDate();d++){const dt=new Date(y,m,d);const dow=(dt.getDay()+6)%7;if(!cur||dow===0){cur=[];weeks.push(cur);}cur.push(dt);}
  const monthLabel=MONTHS[m]+" "+y;
  let totalDone=0,total=0;weeks.forEach(w=>w.forEach(dt=>{const s=dayStats(iso(dt));totalDone+=s.done;total+=s.total;}));
  const mpct=total?Math.round(totalDone/total*100):0;
  return'<div class="card"><div class="card-h"><h2>'+monthLabel+'</h2><span class="sub">'+mpct+'% overall</span></div><div class="goal-bar"><div class="goal-fill" style="width:'+mpct+'%"></div><div class="goal-marker"><span>50%</span></div></div></div>'
  +'<div class="section-gap" style="display:grid;gap:12px">'+weeks.map((w,wi)=>{let wd=0,wt=0;w.forEach(dt=>{const s=dayStats(iso(dt));wd+=s.done;wt+=s.total;});const p=wt?Math.round(wd/wt*100):0;return'<div class="card"><div class="card-h"><h2 style="font-size:13.5px">Week '+(wi+1)+'</h2><span class="sub">'+wd+'/'+wt+' · '+p+'%</span></div>'+pbar(p,p>=50?"#10B981":"var(--accent)")+'<div class="mgrid" style="margin-top:12px">'+w.map(dt=>{const s=dayStats(iso(dt));return'<div class="mcell'+(s.done===0?" zero":"")+'"><div class="d">'+dt.getDate()+'</div><div class="p">'+s.pct+'%</div><div class="b">'+pbar(s.pct,s.pct>=50?"#10B981":"var(--accent)")+'</div></div>';}).join("")+'</div></div>';}).join("")+'</div>';
}
function viewHabitsYear(){
  const y=new Date().getFullYear();

  const startAligned=new Date(y,0,1-dowStart);

  let yrDone=0,yrTotal=0;for(let mi=0;mi<12;mi++){const last=new Date(y,mi+1,0);for(let d=1;d<=last.getDate();d++){const s=dayStats(iso(new Date(y,mi,d)));yrDone+=s.done;yrTotal+=s.total;}}
  const ypct=yrTotal?Math.round(yrDone/yrTotal*100):0;
  const monthLabels=[];for(let mi=0;mi<12;mi++){const dt=new Date(y,mi,1);const idx=Math.round((dt-startAligned)/86400000/7);monthLabels.push({label:MONTHS[mi],week:idx});}
  return'<div class="card"><div class="card-h"><h2>'+y+' Heatmap</h2><span class="sub">'+ypct+'% overall</span></div>'
  +'<div class="goal-bar"><div class="goal-fill" style="width:'+ypct+'%"></div><div class="goal-marker"><span>50%</span></div></div>'
  +'<div class="hm-wrap" style="margin-top:20px"><div style="display:flex;gap:6px;min-width:max-content">'
    +'<div style="display:flex;flex-direction:column;justify-content:space-between;font-size:9.5px;color:var(--text-3);padding:2px 0;height:calc(7 * 12px + 6 * 3px);line-height:12px"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span></div>'
    +'<div><div style="display:flex;gap:3px;margin-bottom:6px;font-size:10px;color:var(--text-3);position:relative;height:12px">'+monthLabels.map(m=>'<span style="position:absolute;left:'+(m.week*15)+'px">'+m.label+'</span>').join("")+'</div>'

    +'<div class="frow"><label>Firebase config</label><textarea class="inp" name="fbcfg" rows="5" placeholder=\'{"apiKey":"...","projectId":"..."}\'>'+esc(cfg)+'</textarea><div class="hint">Paste the object only, from { to }.</div></div>'
    +'<div class="frow"><label>Room code</label><div style="display:flex;gap:8px"><input class="inp" name="roomCode" value="'+esc(S.sync.room||"")+'" placeholder="auto-generated"><button class="btn" data-action="gen-room">New</button></div></div>'
    +'<div class="chips"><button class="btn" data-action="sync-push">⬆ Push</button><button class="btn" data-action="sync-pull">⬇ Pull</button><button class="btn danger" data-action="sync-disable">Disconnect</button></div></div>'
    +'<div class="sett-section"><h4>Notifications</h4><div class="frow"><label>Reminder time</label><input class="inp" type="time" name="notifTime" value="'+esc(S.settings.notifTime||"08:00")+'"></div><div class="chips"><button class="btn" data-action="notif-enable">'+(S.settings.notifEnabled?"✓ Enabled":"Enable")+'</button><button class="btn ghost" data-action="notif-test">Test</button></div></div>'
    +'<div class="sett-section"><h4>Data</h4><div class="chips"><button class="btn" data-action="export-data">⬇ Export</button><button class="btn" data-action="import-data">⬆ Import</button><button class="btn danger" data-action="reset-data">Reset</button></div></div>';
  openModal("Settings",body,v=>{
    S.settings.userName=v.userName||"";
    S.settings.notifTime=v.notifTime||"08:00";
    const raw=(v.fbcfg||"").trim();
    if(raw){try{let clean=raw.replace(/^\s*\/\/.*$/gm,"").replace(/^\s*(const|var|let)\s+\w+\s*=\s*/,"").replace(/;?\s*$/,"");FBCFG=JSON.parse(clean);saveFBCFG();}catch(e){toast("⚠️ Invalid Firebase config");return false;}}else{FBCFG={};saveFBCFG();}
    S.sync.room=(v.roomCode||"").trim();
    S.sync.enabled=!!(FBCFG.apiKey&&S.sync.room);
    store.set(KEY,JSON.stringify(S));
    if(S.sync.enabled)startSync();else stopSync();
    toast("✓ Saved");
  },"Save");
}

const ACTIONS={
  "open-more":()=>openSheet("More",MOBILE_MORE.map(id=>NAV.find(n=>n.id===id))),
  "complete-review":id=>completeReview(id),
  "open-add-session":()=>sessionModal(),
  "session-for-topic":id=>{closeModal();setTimeout(()=>sessionModal(null,id),150);},
  "error-for-topic":id=>{closeModal();setTimeout(()=>errorModal(null,id),150);},
  "edit-session":id=>sessionModal(S.sessions.find(x=>x.id===id)),
  "del-session":id=>openConfirm("Delete session?",()=>{edit(()=>{S.sessions=S.sessions.filter(x=>x.id!==id);});toast("Deleted");}),
  "open-add-topic":()=>topicModal(),
  "edit-topic":id=>topicModal(topicById(id)),
  "topic-detail":id=>topicDetail(id),
  "del-topic":id=>openConfirm("Delete this topic?",()=>{edit(()=>{S.sessions.forEach(s=>{if(s.topicId===id)s.topicId=null;});S.errors.forEach(e=>{if(e.topicId===id)e.topicId=null;});S.mocks.forEach(m=>{m.weak=(m.weak||[]).filter(w=>w!==id);});S.syllabus=S.syllabus.filter(x=>x.id!==id);});toast("Deleted");}),
  "move-up":id=>moveTopic(id,-1),
  "move-down":id=>moveTopic(id,1),
  "subj-up":id=>moveSubject(id,-1),
  "subj-down":id=>moveSubject(id,1),
  "add-subject":()=>addSubjectModal(),
  "del-subject":sub=>openConfirm("Remove the subject group \""+sub+"\" and all its topics?",()=>{edit(()=>{const ids=S.syllabus.filter(t=>t.subject===sub).map(t=>t.id);S.sessions.forEach(s=>{if(ids.indexOf(s.topicId)>-1)s.topicId=null;});S.errors.forEach(e=>{if(ids.indexOf(e.topicId)>-1)e.topicId=null;});S.mocks.forEach(m=>{m.weak=(m.weak||[]).filter(w=>ids.indexOf(w)<0);});S.syllabus=S.syllabus.filter(t=>t.subject!==sub);S.subjectOrder=(S.subjectOrder||[]).filter(x=>x!==sub);S.tax.subjects=(S.tax.subjects||[]).filter(x=>x!==sub);});toast("Subject removed");}),
  "start-topic":id=>{const t=topicById(id);if(t){edit(()=>{t.status="Learning";});toast("▸ Started");}},
  "goto-topic":id=>{const t=topicById(id);sf.q=t?t.topic.toLowerCase():"";sf.exam="All";sf.status="All";sf.priority="All";go("syllabus");},
  "goto-syllabus":id=>{if(id){ACTIONS["goto-topic"](id);}else go("syllabus");},
  "goto-mocks":()=>go("mocks"),
  "goto-radar":()=>go("radar"),
  "toggle-subj":id=>{sf.closed[id]=!sf.closed[id];const g=$('.subj-group[data-subj="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');if(g){g.classList.toggle("closed");const b=$(".subj-body",g);if(b)b.hidden=g.classList.contains("closed");}},
  "open-add-error":()=>errorModal(),
  "edit-error":id=>errorModal(S.errors.find(x=>x.id===id)),
  "del-error":id=>openConfirm("Delete error?",()=>{edit(()=>{S.errors=S.errors.filter(x=>x.id!==id);});toast("Deleted");}),
  "open-add-mock":()=>mockModal(),
  "edit-mock":id=>mockModal(S.mocks.find(x=>x.id===id)),
  "del-mock":id=>openConfirm("Delete mock?",()=>{edit(()=>{S.mocks=S.mocks.filter(x=>x.id!==id);});toast("Deleted");}),
  "open-add-task":()=>taskModal(),
  "edit-task":id=>taskModal(S.tasks.find(x=>x.id===id)),
  "del-task":id=>openConfirm("Delete task?",()=>{edit(()=>{S.tasks=S.tasks.filter(x=>x.id!==id);});toast("Deleted");}),
  "task-advance":id=>{const t=S.tasks.find(x=>x.id===id);if(!t)return;const sts=taxList("taskStatus");const i=sts.indexOf(t.status);edit(()=>{t.status=sts[Math.min(sts.length-1,i+1)];});toast(t.status==="Completed"?"✓ Done!":"▸ "+t.status);},
  "task-reopen":id=>{const t=S.tasks.find(x=>x.id===id);if(!t)return;edit(()=>{t.status=taxList("taskStatus")[0];});toast("Reopened");},
  "task-template":()=>{if(S.tasks.length&&!confirm("Add the standard daily routine template on top of existing tasks?"))return;snapshot();ROUTINE_TEMPLATE.forEach(r=>S.tasks.push(Object.assign({id:uid("k"),status:taxList("taskStatus")[0],due:"",progress:""},r)));saveLocal();rerender();toast("Template added");},
  "add-link":()=>{openModal("Add quick link",'<div class="frow"><label>Label</label><input class="inp" name="label" placeholder="e.g. RBI Live Class"></div><div class="frow"><label>URL</label><input class="inp" name="url" placeholder="https://…"></div>',v=>{if(!v.label||!v.url){toast("⚠️ Both required");return false;}edit(()=>{S.links.push({id:uid("l"),label:v.label,url:v.url});});toast("Link added");},"Add");},
  "del-link":id=>openConfirm("Remove this link?",()=>{edit(()=>{S.links=S.links.filter(l=>l.id!==id);});toast("Removed");}),
  "habit":(id,el)=>{const day=el.dataset.day,hid=el.dataset.hid;habitToggle(parseInt(day),hid);el.classList.toggle("on");const start=mondayOf(weekOff);const dISO=iso(new Date(start.getFullYear(),start.getMonth(),start.getDate()+parseInt(day)));const ds=dayStats(dISO);const dp=$('[data-daypct="'+day+'"]');if(dp)dp.textContent=ds.done+"/"+ds.total;const st=weekStats();const pv=$("#wk-pct");if(pv){pv.textContent=st.pct+"%";pv.style.color=st.pct>=50?"#10B981":"var(--text)";}const pc=$("#wk-cnt");if(pc)pc.textContent=st.c+" of "+st.total+" actions · goal >50%";const gf=$(".goal-fill");if(gf)gf.style.width=Math.min(100,st.pct)+"%";},
  "edit-habits":()=>habitDefsModal(),
  "week-prev":()=>{weekOff--;rerender();},
  "week-next":()=>{weekOff++;rerender();},
  "week-today":()=>{weekOff=0;rerender();},
  "timer-start-task":id=>{const t=S.tasks.find(x=>x.id===id);if(!t)return;timerStart({label:t.title,taskId:id,topicId:null});toast("⏱ Timer started");},
  "timer-start-topic":id=>{const t=topicById(id);if(!t)return;timerStart({label:t.topic,topicId:id,taskId:null});toast("⏱ Timer started");},
  "timer-start-session":id=>{const s=S.sessions.find(x=>x.id===id);if(!s)return;timerStart({label:s.name,topicId:s.topicId||null,taskId:null});toast("⏱ Timer started");},
  "timer-stop":()=>timerStop(false),
  "timer-cancel":()=>timerStop(true),
  "open-settings":()=>openSettings(),
  "gen-room":()=>{const code=(Math.random().toString(36).slice(2,6)+"-"+Math.random().toString(36).slice(2,6)+"-"+Math.random().toString(36).slice(2,6)).toUpperCase();const inp=$('.modal [name="roomCode"]');if(inp){inp.value=code;toast("New room code","Press Save to connect");}},
  "sync-push":()=>pushNow(false),
  "sync-pull":()=>{if(!S.sync.enabled||!S.sync.room){toast("⚠️ Not connected");return;}startSync();toast("⬇ Checking cloud…");},
  "sync-disable":()=>{S.sync.enabled=false;store.set(KEY,JSON.stringify(S));stopSync();toast("Disconnected");closeModal();},
  "notif-enable":async()=>{const ok=await requestNotifPerm();if(ok){S.settings.notifEnabled=true;store.set(KEY,JSON.stringify(S));toast("✓ On");closeModal();openSettings();}},
  "notif-test":async()=>{const ok=await requestNotifPerm();if(!ok)return;try{new Notification("Apex — test",{body:"Notifications work."});toast("✓ Sent");}catch(e){toast("⚠️ Failed");}},
  "export-data":()=>{try{const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="apex-backup-"+todayISO()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast("Exported ⬇");}catch(e){toast("⚠️ Export failed");}},
  "import-data":()=>{const inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.syllabus))throw new Error("bad");snapshot();S=d;saveLocal();applyTheme(S.settings.theme||"apex");rerender();toast("Restored ✓");}catch(e){toast("⚠️ Invalid file");}};r.readAsText(f);};inp.click();},
  "reset-data":()=>{openModal("Reset everything?",'<p class="muted small">Wipes every edit and restores the original import. Your Firebase config is kept.</p>',()=>{snapshot();S=seedState();saveLocal();applyTheme("apex");rerender();toast("Reset ✓");},"Reset");const b=$("[data-msave]");if(b){b.classList.remove("primary");b.classList.add("danger");}},
  "undo":()=>undo(),
  "dismiss-welcome":()=>{const chk=$("#welcome-dont-show");S.settings.welcomeDone=true;if(chk&&chk.checked)S.settings.welcomeDone=true;saveLocal();const r=$("#welcome-root");if(r)r.innerHTML="";rerender();},
  "show-guide":()=>{S.settings.welcomeDone=false;saveLocal();welcomeOverlay();}
};

document.addEventListener("click",e=>{
  /* theme picker */
  const th=e.target.closest("[data-theme-pick]");
  if(th){const id=th.dataset.themePick;snapshot();S.settings.theme=id;saveLocal();applyTheme(id);$$(".theme-sw").forEach(s=>s.classList.toggle("on",s===th));toast("Theme: "+id);return;}
  /* option manager open */
  const addOpt=e.target.closest("[data-addopt]");
  if(addOpt){e.preventDefault();e.stopPropagation();
    const taxKey=addOpt.dataset.taxkey||addOpt.dataset.addopt;
    const label=addOpt.dataset.addlabel||taxKey;
    openOptionManager(taxKey,label);
    return;
  }
  /* option manager delete */
  const omDel=e.target.closest("[data-om-del]");
  if(omDel){e.preventDefault();e.stopPropagation();
    const key=omDel.dataset.omKey,v=omDel.dataset.omDel;
    snapshot();taxRemove(key,v);renderOMList(key);
    /* refresh page views */
    if(key==="errTypes"){const s=$("#err-type");if(s){const cur=ef.type;s.innerHTML=["All"].concat(taxList("errTypes")).map(t=>'<button class="chip'+(ef.type===t?" on":"")+'" data-etype="'+esc(t)+'">'+esc(t)+'</button>').join("")+'<button class="add-opt-btn" data-addopt="errType" data-taxkey="errTypes" data-addlabel="Error type" title="Manage error types">'+ICONS.plus+'</button>';}}
    if(key==="errSources"){const s=$("#err-src");if(s){const cur=ef.source;s.innerHTML='<option value="All">All sources</option>'+selOpts(taxList("errSources"),cur);}}
    if(key==="statuses"){const s=$("#syl-status");if(s){const cur=sf.status;s.innerHTML='<option value="All">All statuses</option>'+selOpts(taxList("statuses"),cur);}}
    rerender();
    return;
  }
  /* date picker button */
  const openPick=e.target.closest("[data-openpicker]");
  if(openPick){
    e.preventDefault();e.stopPropagation();
    const name=openPick.dataset.openpicker;
    const hidden=document.querySelector('input[name="'+name+'"]');
    const text=document.querySelector('[data-datefield="'+name+'"]');
    const tmp=document.createElement("input");tmp.type="date";tmp.value=(hidden&&hidden.value)||todayISO();
    tmp.style.cssText="position:fixed;left:-1000px;top:-1000px;opacity:0";
    document.body.appendChild(tmp);
    const cleanup=()=>{setTimeout(()=>{try{tmp.remove();}catch(e){}},50);};
    tmp.addEventListener("change",()=>{if(tmp.value){if(hidden)hidden.value=tmp.value;if(text)text.value=fmtDY(tmp.value);}cleanup();});
    tmp.addEventListener("blur",cleanup);
    try{if(tmp.showPicker)tmp.showPicker();else tmp.click();}catch(err){tmp.click();}
    return;
  }
  /* nav */
  const b=e.target.closest("[data-nav]");if(b){e.preventDefault();closeSheet();go(b.dataset.nav);return;}
  /* habit sub-tab */
  const ht=e.target.closest("[data-htab]");if(ht){e.preventDefault();hTab=ht.dataset.htab;rerender();return;}
  /* action */
  const el=e.target.closest("[data-action]");
  if(el&&!el.disabled){const fn=ACTIONS[el.dataset.action];if(fn){e.preventDefault();fn(el.dataset.id,el,e);return;}}
});
document.addEventListener("input",e=>{
  const el=e.target.closest("[data-datefield]");
  if(el){
    const name=el.dataset.datefield;
    const hidden=document.querySelector('input[name="'+name+'"]');
    const raw=el.value.trim();
    if(!raw){if(hidden)hidden.value="";el.classList.remove("invalid");return;}
    const parsed=parseDMY(raw);
    if(parsed){if(hidden)hidden.value=parsed;el.classList.remove("invalid");}
    else{if(hidden)hidden.value="";el.classList.add("invalid");}
    return;
  }
  const hdName=e.target.closest("[data-hd-name]");
  if(hdName){const gid=hdName.dataset.hdName;S.habitDefs.forEach(g=>{if(g.id===gid)g.name=hdName.value;});store.set(KEY,JSON.stringify(S));return;}
  const hdItem=e.target.closest("[data-hd-item]");
  if(hdItem){const iid=hdItem.dataset.hdItem;S.habitDefs.forEach(g=>g.items.forEach(i=>{if(i.id===iid)i.label=hdItem.value;}));store.set(KEY,JSON.stringify(S));return;}
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-change]");if(!el)return;
  const id=el.dataset.id,k=el.dataset.change;
  const t=topicById(id);
  if(k==="syl-status"&&t){snapshot();t.status=el.value;saveLocal();renderSylList();return;}
  if(k==="syl-priority"&&t){snapshot();t.priority=el.value;saveLocal();renderSylList();return;}
  if(k==="syl-weight"&&t){snapshot();t.weightage=el.value;saveLocal();renderSylList();return;}
  if(k==="sess-logdate"){const s=S.sessions.find(x=>x.id===id);if(s){snapshot();s.logDate=el.value||null;saveLocal();rerender();return;}}
  if(k==="sess-reviewed"){const s=S.sessions.find(x=>x.id===id);if(s){snapshot();s.lastReviewed=el.value||null;saveLocal();rerender();return;}}
  if(k==="err-date"){const er=S.errors.find(x=>x.id===id);if(er){snapshot();er.date=el.value;saveLocal();return;}}
  /* habit def group/item edits */
  const hdName=e.target.closest("[data-hd-name]");
  if(hdName){const gid=hdName.dataset.hdName;S.habitDefs.forEach(g=>{if(g.id===gid)g.name=hdName.value;});store.set(KEY,JSON.stringify(S));return;}
  const hdItem=e.target.closest("[data-hd-item]");
  if(hdItem){const iid=hdItem.dataset.hdItem;S.habitDefs.forEach(g=>g.items.forEach(i=>{if(i.id===iid)i.label=hdItem.value;}));store.set(KEY,JSON.stringify(S));return;}
});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="z"&&!e.shiftKey){const tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea")return;e.preventDefault();undo();return;}
  const el=e.target&&e.target.closest?e.target.closest(".hcheck"):null;
  if(el&&(e.key===" "||e.key==="Enter")){e.preventDefault();ACTIONS.habit(null,el);}
});

/* habit defs & option manager delegated */
document.addEventListener("click",e=>{
  const hdAddBtn=e.target.closest("[data-hd-add]");
  if(hdAddBtn){snapshot();(S.habitDefs=S.habitDefs||[]).push({id:uid("hg"),name:"New group",items:[{id:uid("hi"),label:"New item"}]});saveLocal();renderHDList();return;}
  const hdDelG=e.target.closest("[data-hd-delg]");
  if(hdDelG){snapshot();S.habitDefs=S.habitDefs.filter(g=>g.id!==hdDelG.dataset.hdDelg);saveLocal();renderHDList();return;}
  const hdDelI=e.target.closest("[data-hd-deli]");
  if(hdDelI){const id=hdDelI.dataset.hdDeli;snapshot();S.habitDefs.forEach(g=>{g.items=g.items.filter(i=>i.id!==id);});saveLocal();renderHDList();return;}
  const hdAddI=e.target.closest("[data-hd-addi]");
  if(hdAddI){const gid=hdAddI.dataset.hdAddi;snapshot();S.habitDefs.forEach(g=>{if(g.id===gid)g.items.push({id:uid("hi"),label:"New item"});});saveLocal();renderHDList();return;}
});
