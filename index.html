*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:14.5px/1.55 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden;transition:background .3s var(--ease),color .3s var(--ease)}
::selection{background:var(--accent-glow);color:var(--text)}
h1,h2,h3,h4,.brand b,.hero-head h2,.card-h h2,.modal h3,.next-action .t,.stat .v{font-family:var(--font-display);letter-spacing:-.02em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--text)}
a{color:var(--text);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
#errbar{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#3a1f1d;color:#ffb3aa;border-bottom:1px solid rgba(239,68,68,.5);padding:10px 16px;font-size:12.5px;font-weight:600;white-space:pre-wrap}
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar-w);flex:0 0 auto;position:fixed;inset:0 auto 0 0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:24px 12px 16px;background:var(--surface);border-right:1px solid var(--border);z-index:40;transition:transform .34s var(--ease-out),background .3s,border-color .3s;will-change:transform}
body.sb-collapsed #sidebar{transform:translateX(-100%)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 24px}
.brand .mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.06);color:var(--btn-primary-fg);font-family:var(--font-display);font-weight:700}
.brand b{font-size:15px;font-weight:700;display:block;line-height:1.1;letter-spacing:-.01em}
.brand span{font-size:10px;color:var(--text-3);letter-spacing:.09em;text-transform:uppercase;font-weight:600;font-family:"Inter",sans-serif}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px 9px 12px;border-radius:var(--r-sm);color:var(--text-2);font-size:13.5px;font-weight:500;position:relative;transition:all .2s var(--ease);width:100%;text-align:left;cursor:pointer;user-select:none}
.nav-item>svg{width:17px;height:17px;flex:0 0 auto;opacity:.75;transition:opacity .2s,transform .25s var(--ease-out)}
.nav-item>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item:hover>svg{transform:scale(1.08)}
.nav-item:active{transform:scale(.98)}
.nav-item.active{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.nav-item.active>svg{color:var(--accent-2);opacity:1}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:24%;bottom:24%;width:2px;border-radius:2px;background:var(--accent-2)}
.nav-info{margin-left:6px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;color:var(--text-3);font-size:10.5px;font-weight:700;font-family:"Inter",sans-serif;font-style:normal;line-height:1;border:1.5px solid var(--border-2);background:transparent;opacity:.5;transition:opacity .18s,color .15s,border-color .15s,transform .2s var(--ease-out),background .15s;flex-shrink:0;cursor:help;padding:0}
.nav-item:hover .nav-info{opacity:.95}
.nav-info:hover{opacity:1!important;color:var(--accent-2);border-color:var(--accent-2);background:var(--accent-glow);transform:scale(1.12)}
.nav-badge{font-size:10.5px;font-weight:700;background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.25);min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;font-family:"Inter",sans-serif;flex-shrink:0}
.side-foot{margin-top:auto;padding:12px 4px 2px;border-top:1px solid var(--border);display:flex;gap:6px}
#main{flex:1;margin-left:var(--sidebar-w);min-width:0;transition:margin-left .34s var(--ease-out);display:flex;flex-direction:column}
body.sb-collapsed #main{margin-left:0}
#topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:14px 34px 12px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
#page-title{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.date-chip{font-size:12.5px;color:var(--text-2);padding:6px 12px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);transition:all .22s var(--ease)}
.date-chip:hover{color:var(--text);border-color:var(--border-2);transform:translateY(-1px)}
.streak-chip{font-size:12.5px;font-weight:600;color:#F59E0B;padding:6px 11px;border-radius:var(--r-pill);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-family:"Inter",sans-serif;transition:all .24s var(--ease)}
.streak-chip svg{width:13px;height:13px;transition:transform .38s var(--ease-out)}
.streak-chip:hover{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.45);transform:translateY(-2px);box-shadow:0 6px 18px rgba(245,158,11,.22)}
.streak-chip:hover svg{transform:scale(1.18) rotate(-8deg)}
.icon-btn{width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2);border:1px solid var(--border);background:var(--surface);transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .2s,border-color .2s,color .2s;flex-shrink:0;position:relative;overflow:hidden}
.icon-btn::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 50%,var(--accent-glow),transparent 72%);opacity:0;transition:opacity .3s var(--ease);pointer-events:none}
.icon-btn:hover::after{opacity:1}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-2);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.16)}
.icon-btn:active{transform:scale(.92);box-shadow:none}
.icon-btn svg{width:16px;height:16px;transition:transform .32s var(--ease-out)}
.icon-btn:hover svg{transform:scale(1.14)}
#settings-btn:hover svg{transform:rotate(65deg) scale(1.1)}
#help-btn:hover svg{transform:scale(1.12) rotate(-7deg)}
.sb-toggle.on{color:var(--accent-2);border-color:var(--accent-2);background:var(--accent-glow)}
.sync-pill,.timer-pill{font-size:12px;font-weight:600;padding:7px 12px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .2s,border-color .2s,color .2s;color:var(--text-2);white-space:nowrap;flex-shrink:0;font-family:"Inter",sans-serif;min-height:36px}
.sync-pill:hover,.timer-pill:hover{background:var(--surface-2);border-color:var(--border-2);color:var(--text);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.14)}
.sync-pill:active,.timer-pill:active{transform:scale(.95)}
.sync-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex-shrink:0;transition:background .3s}
.sync-pill.synced .dot{background:#10B981;animation:dotGlow 2.6s ease-in-out infinite}
.sync-pill.syncing .dot,.sync-pill.connecting .dot{background:#F59E0B;animation:pulse 1.2s infinite}
.sync-pill.error .dot{background:#EF4444}
.sync-pill.locked .dot{background:#A855F7}
@keyframes dotGlow{0%,100%{box-shadow:0 0 5px rgba(16,185,129,.5)}50%{box-shadow:0 0 12px rgba(16,185,129,.95)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.timer-pill svg{transition:transform .35s var(--ease-out)}
.timer-pill:hover svg{transform:scale(1.15)}
.timer-pill.running{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fca5a5}
.timer-pill.running svg{animation:spin 8s linear infinite}
.timer-pill.running:hover{box-shadow:0 6px 18px rgba(239,68,68,.22)}
.timer-pill.paused{border-color:var(--border-2);color:var(--text-2)}

.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}

.task-card .tt{font-size:13.5px;font-weight:600;line-height:1.35}
.task-card .tm{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.task-card .prog{font-size:12px;color:var(--text-2);margin-top:10px;background:var(--surface-2);border-radius:6px;padding:8px 10px;border:1px solid var(--border)}
.task-card .acts{display:flex;gap:6px;margin-top:12px;align-items:center;flex-wrap:wrap}
.tb-chip{font-size:11px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:var(--r-pill);font-weight:600;white-space:nowrap;font-family:"Inter",sans-serif}
.habit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}

.mcell .d{font-size:11px;font-weight:600;color:var(--text-3);font-family:"Inter",sans-serif}
.mcell .p{font-family:var(--font-display);font-size:15px;font-weight:700;margin-top:3px}

.mcell.zero{opacity:.35}
.hm-wrap{overflow-x:auto;padding:4px 0}

.hm i.l2{background:color-mix(in srgb,var(--accent-2) 50%,transparent)}

.hm i.l4{background:var(--accent-2)}

.ws-day{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}

.ws-day.today .ws-name{color:var(--text)}
.ws-day.today .ws-bar{outline:1px solid var(--accent-2);outline-offset:2px}
.chart-wrap{width:100%;overflow-x:auto}
.chart-wrap svg{min-width:520px;width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text-2);font-family:"Inter",sans-serif}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px}
#modal-root:empty{display:none}
.overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .22s var(--ease-out)}

.frow{margin-bottom:14px}

.modal-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;position:sticky;bottom:-28px;background:var(--surface);padding:16px 0 0;border-top:1px solid var(--border)}

.pick-toolbar{display:flex;gap:8px;align-items:center;margin:8px 0 6px;font-size:11.5px;color:var(--text-3);font-family:"Inter",sans-serif}

.picker-list{max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2)}
.pick-group{border-bottom:1px solid var(--border)}

.pick-group-h{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;font-size:13px;user-select:none;transition:background .15s}

.pick-group-h .chev{transition:transform .2s;width:14px;height:14px;color:var(--text-3);flex-shrink:0}

.pick-group-body{padding:2px 0 8px;background:var(--surface)}
.pick-opt{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 30px;font-size:12.5px;cursor:pointer;transition:background .12s;line-height:1.4}
.pick-opt:hover{background:var(--surface-2)}
.pick-opt.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pick-opt .cbox{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--border-2);display:grid;place-items:center;flex-shrink:0;transition:all .15s;font-size:10px;line-height:1;color:var(--btn-primary-fg);font-weight:700}
.pick-opt.sel .cbox{background:var(--accent-2);border-color:var(--accent-2)}
.pick-opt .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-opt .ptag{font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--text-3);font-family:"Inter",sans-serif}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.theme-sw{border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;cursor:pointer;transition:all .2s var(--ease-out);background:var(--surface)}
.theme-sw:hover{border-color:var(--border-2);transform:translateY(-2px)}
.theme-sw.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.theme-sw .sw{display:flex;gap:4px;margin-bottom:10px}
.theme-sw .sw span{flex:1;height:20px;border-radius:4px}
.theme-sw .tn{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:-.01em}
.theme-sw .td{font-size:10.5px;color:var(--text-3);margin-top:3px;line-height:1.4;font-family:"Inter",sans-serif}
.cal-pop{position:fixed;z-index:500;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,.4);padding:14px;animation:popIn .2s var(--ease-out);width:290px}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-head button{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--text-2);border:1px solid var(--border);background:var(--surface-2);transition:all .15s;font-size:16px}
.cal-head button:hover{background:var(--surface-3);color:var(--text)}
.cal-head b{flex:1;text-align:center;font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:-.01em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:10px;font-weight:700;color:var(--text-3);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.05em;font-family:"Inter",sans-serif}
.cal-day{aspect-ratio:1;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--text-2);display:grid;place-items:center;transition:all .15s;min-height:34px;font-family:"Inter",sans-serif}
.cal-day:hover{background:var(--surface-2);color:var(--text)}
.cal-day.out{opacity:.25}
.cal-day.today{color:var(--text);border:1px solid var(--text-3)}
.cal-day.sel{background:var(--accent);color:var(--btn-primary-fg);border-color:transparent}
.cal-foot{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.cal-foot button{flex:1;padding:8px 10px;font-size:12px;font-weight:600;border-radius:6px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);transition:all .15s;font-family:"Inter",sans-serif;min-height:36px}

#scratch-fab{position:fixed;right:20px;bottom:24px;z-index:80;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--btn-primary-fg);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:all .2s var(--ease);border:1px solid var(--accent)}

function migrateState(s){
  if(!s||typeof s!=="object")return s;
  const from=s.schemaVersion||1;
  if(from<10){
    if(Array.isArray(s.habitDefs)){s.habitDefs=s.habitDefs.map(g=>{const looksLikeHours=g&&g.items&&g.items.length===3&&g.items.every(it=>/hrs?\s*done/i.test(it.label||""));if(g.name==="CRACK THE EXAM"||looksLikeHours){return{id:g.id,name:g.name,type:"hours",thresholds:[4,8,12]};}return g;});}
    if(s.habits&&typeof s.habits==="object"){const hoursGroup=(s.habitDefs||[]).find(g=>g.type==="hours");Object.keys(s.habits).forEach(date=>{const day=s.habits[date];if(!day||typeof day!=="object")return;if(hoursGroup&&typeof day.hours!=="number"){let h=0;["hi1","hi2","hi3"].forEach((oldId,i)=>{if(day[oldId])h=hoursGroup.thresholds[i]||h;});if(h>0)day.hours=h;}});}
    if(Array.isArray(s.sessions)){s.sessions=s.sessions.map(sess=>{if(typeof sess.interval==="number"&&sess.nextReview!==undefined)return sess;let interval;if(sess.stage==="Mastered"){interval=90;}else{const stageIdx=STAGES.indexOf(sess.stage);interval=stageIdx>=0?(INTERVALS[stageIdx]||1):1;}const ease=2.5;const lastReviewed=sess.lastReviewed||null;const nextReview=lastReviewed?addDays(lastReviewed,interval):todayISO();return Object.assign({},sess,{interval,ease,nextReview,stage:stageFromInterval(interval),history:lastReviewed?[{date:lastReviewed,grade:"good"}]:[]});});}
    s.schemaVersion=10;
  }
  if(Array.isArray(s.syllabus)){
    s.syllabus.forEach(t=>{if(t.parentId===undefined)t.parentId=null;});
    const lookup={};
    s.syllabus.forEach(t=>{const k=t.subject+"::"+t.topic;if(!lookup[k])lookup[k]=t.id;});
    s.syllabus.forEach(t=>{
      if(!(t.topic in SYL_PARENT_MAP))return;
      const parentTitle=SYL_PARENT_MAP[t.topic];
      if(parentTitle===null){t.parentId=null;return;}
      if(parentTitle===undefined)return;
      const parentId=lookup[t.subject+"::"+parentTitle];
      if(parentId&&parentId!==t.id)t.parentId=parentId;
    });
  }
  s.schemaVersion=11;
  return s;
}

let syncKey=null;let syncSalt=null;
function bufToB64(buf){const bytes=new Uint8Array(buf);let s="";for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s);}
function b64ToBuf(b64){const s=atob(b64);const bytes=new Uint8Array(s.length);for(let i=0;i<s.length;i++)bytes[i]=s.charCodeAt(i);return bytes;}
async function deriveKey(passphrase,saltBytes){const enc=new TextEncoder();const baseKey=await crypto.subtle.importKey("raw",enc.encode(passphrase),{name:"PBKDF2"},false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:saltBytes,iterations:250000,hash:"SHA-256"},baseKey,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function setPassphrase(pass){if(!S.sync.room)throw new Error("Set a room code first");const saltKey="apex-salt-"+S.sync.room;let saltB64=localStorage.getItem(saltKey);if(!saltB64){const salt=new Uint8Array(16);crypto.getRandomValues(salt);saltB64=bufToB64(salt);localStorage.setItem(saltKey,saltB64);}syncSalt=b64ToBuf(saltB64);syncKey=await deriveKey(pass,syncSalt);}
async function encryptState(obj){if(!syncKey)throw new Error("Locked");const iv=new Uint8Array(12);crypto.getRandomValues(iv);const plain=new TextEncoder().encode(JSON.stringify(obj));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},syncKey,plain);return{v:1,iv:bufToB64(iv),ct:bufToB64(ct)};}
async function decryptState(payload){if(!syncKey)throw new Error("Locked");const iv=b64ToBuf(payload.iv);const ct=b64ToBuf(payload.ct);const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},syncKey,ct);return JSON.parse(new TextDecoder().decode(plain));}
function clearSyncKey(){syncKey=null;syncSalt=null;}

let syncStatus="off",fbReady=false,syncUnsub=null,syncTimer=null,_applyingRemote=false;
function setSyncStatus(st){syncStatus=st;updateSyncPill();}
function updateSyncPill(){const el=$("#sync-pill");if(!el)return;const map={off:"Local",connecting:"Connect…",syncing:"Syncing",synced:"Synced",error:"Error",locked:"Locked"};const st=(S.sync.enabled&&S.sync.room)?(syncKey?syncStatus:"locked"):"off";el.className="sync-pill "+st;el.innerHTML='<span class="dot"></span><span>'+(map[st]||st)+'</span>';el.title=(st==="locked")?"Click to unlock sync":("Sync: "+(map[st]||st));}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("Failed: "+src));document.head.appendChild(s);});}
async function initFirebase(){if(fbReady)return true;if(!FBCFG.apiKey||!FBCFG.projectId)return false;if(!window.firebase){await loadScript("https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js");await loadScript("https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js");}if(!window.firebase)return false;if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(FBCFG);fbReady=true;return true;}
async function pushNow(silent){if(!S.sync.enabled||!S.sync.room||!syncKey)return;try{setSyncStatus("syncing");if(!await initFirebase()){setSyncStatus("error");if(!silent)toast("⚠️ Firebase not configured");return;}const db=firebase.firestore();const payload=JSON.parse(JSON.stringify(S));delete payload.sync;delete payload._lastSync;const encrypted=await encryptState(payload);const now=new Date().toISOString();await db.collection("exam_os_rooms").doc(S.sync.room).set({enc:encrypted,updatedAt:now});S._lastSync=now;store.set(KEY,JSON.stringify(S));setSyncStatus("synced");if(!silent)toast("☁️ Pushed (encrypted)");}catch(e){setSyncStatus("error");if(!silent)toast("⚠️ Push failed",e.message);}}
function queueSync(){if(!S.sync.enabled||!syncKey||_applyingRemote)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>pushNow(true),2500);}
async function pullNow(silent){if(!S.sync.enabled||!S.sync.room||!syncKey)return;try{setSyncStatus("connecting");if(!await initFirebase()){setSyncStatus("error");if(!silent)toast("⚠️ Firebase not configured");return;}const db=firebase.firestore();const ref=db.collection("exam_os_rooms").doc(S.sync.room);const snap=await ref.get();if(!snap.exists){if(!silent)toast("No cloud copy yet");setSyncStatus("synced");return;}const data=snap.data();if(!data||!data.enc){if(!silent)toast("⚠️ Cloud copy unreadable");setSyncStatus("error");return;}let remote;try{remote=await decryptState(data.enc);}catch(e){if(!silent)toast("❌ Wrong passphrase","Could not decrypt cloud copy");setSyncStatus("error");return;}if(!silent&&!confirm("Replace this device's data with the cloud copy?")){setSyncStatus("synced");return;}_applyingRemote=true;Object.keys(remote).forEach(k=>{S[k]=remote[k];});S.schemaVersion=SCHEMA_VERSION;S.sync={enabled:true,room:ref.id};S._lastSync=data.updatedAt;_applyingRemote=false;applyTheme(S.settings.theme||"obsidian");store.set(KEY,JSON.stringify(S));rerender();setSyncStatus("synced");if(!silent)toast("⬇ Pulled (decrypted)");}catch(e){setSyncStatus("error");if(!silent)toast("⚠️ Pull failed",e.message);}}
async function startSync(){if(!S.sync.enabled||!S.sync.room){setSyncStatus("off");return;}if(!syncKey){setSyncStatus("locked");return;}try{setSyncStatus("connecting");if(!await initFirebase()){setSyncStatus("error");toast("⚠️ Paste Firebase config in Settings");return;}const db=firebase.firestore();const ref=db.collection("exam_os_rooms").doc(S.sync.room);if(syncUnsub)syncUnsub();syncUnsub=ref.onSnapshot(doc=>{if(!doc.exists||_applyingRemote)return;const d=doc.data();if(!d||!d.enc||!d.updatedAt)return;if(!S._lastSync||d.updatedAt>S._lastSync){decryptState(d.enc).then(remote=>{_applyingRemote=true;Object.keys(remote).forEach(k=>{S[k]=remote[k];});S.schemaVersion=SCHEMA_VERSION;S.sync={enabled:true,room:ref.id};S._lastSync=d.updatedAt;_applyingRemote=false;applyTheme(S.settings.theme||"obsidian");store.set(KEY,JSON.stringify(S));rerender();setSyncStatus("synced");}).catch(()=>setSyncStatus("error"));}});setSyncStatus("synced");}catch(e){setSyncStatus("error");toast("⚠️ Sync error",e.message);}}
function stopSync(){if(syncUnsub){syncUnsub();syncUnsub=null;}clearSyncKey();setSyncStatus("off");}
async function unlockSync(pass){if(!S.sync.room)return false;await setPassphrase(pass);sessionStorage.setItem("apex-sync-pass",pass);toast("🔓 Sync unlocked");startSync();return true;}
function lockSync(){clearSyncKey();sessionStorage.removeItem("apex-sync-pass");if(syncUnsub){syncUnsub();syncUnsub=null;}setSyncStatus("locked");toast("🔒 Sync locked");}

function requestNotifPerm(){if(!("Notification"in window)){toast("⚠️ Not supported");return Promise.resolve(false);}if(Notification.permission==="granted")return Promise.resolve(true);return Notification.requestPermission().then(p=>p==="granted");}
function checkAndNotify(){try{if(!S.settings||!S.settings.notifEnabled)return;if(!("Notification"in window)||Notification.permission!=="granted")return;const today=todayISO();if(S.settings.lastNotif===today)return;const due=dueSessions().length;if(due===0)return;const now=new Date();const parts=(S.settings.notifTime||"08:00").split(":").map(Number);if(now.getHours()<parts[0]||(now.getHours()===parts[0]&&now.getMinutes()<parts[1]))return;new Notification("Apex — "+due+" review"+(due>1?"s":"")+" due",{body:"Clear today's agenda.",tag:"apex-daily"});S.settings.lastNotif=today;store.set(KEY,JSON.stringify(S));}catch(e){}}

function mondayOf(off){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+(off||0)*7);return d;}
let weekOff=0,hTab="week";
function dayStats(dISO){const dm=S.habits[dISO]||{};let done=0,total=0;(S.habitDefs||[]).forEach(g=>{if(g.type==="hours"){const hours=typeof dm.hours==="number"?dm.hours:0;total+=(g.thresholds||[]).length;(g.thresholds||[]).forEach(thr=>{if(hours>=thr)done++;});}else if(Array.isArray(g.items)){total+=g.items.length;g.items.forEach(it=>{if(dm[it.id])done++;});}});return{done,total,pct:total?Math.round(done/total*100):0};}
function weekStats(off){const start=mondayOf(off===undefined?weekOff:off);let done=0,total=0;for(let i=0;i<7;i++){const d=iso(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));const s=dayStats(d);done+=s.done;total+=s.total;}return{c:done,total:total,pct:total?Math.round(done/total*100):0};}

function isRedundantContainer(topicName,subject){
  const a=String(topicName||"").toLowerCase().trim();
  const b=String(subject||"").toLowerCase().trim();
  if(a===b)return true;
  if(b==="english grammar"&&a==="english")return true;
  if(b==="economical issues"&&a==="economic issues")return true;
  if(b==="descriptive english"&&a==="descriptive english/writing")return true;
  if(b==="ca"&&a==="edutap ca")return true;
  return false;
}
function renderSylList(){
  const list=sylFiltered();
  const visibleIds=new Set(list.map(t=>t.id));
  const childrenMap=new Map();
  for(let i=0;i<list.length;i++){
    const t=list[i];
    const isRoot=!t.parentId||!visibleIds.has(t.parentId);
    const key=isRoot?null:t.parentId;
    let arr=childrenMap.get(key);
    if(!arr){arr=[];childrenMap.set(key,arr);}
    arr.push(t);
  }

  // --- Hoist children of redundant container topics (e.g. "Maths" inside "maths") ---
  const roots=(childrenMap.get(null)||[]).slice();
  const containerIds=new Set();
  for(const t of roots){
    if(isRedundantContainer(t.topic,t.subject))containerIds.add(t.id);
  }
  if(containerIds.size){
    // Anything whose parent is a redundant container becomes a top-level topic
    for(let i=0;i<list.length;i++){
      const t=list[i];
      if(t.parentId&&containerIds.has(t.parentId)){
        // Reassign to null bucket
        let nullArr=childrenMap.get(null);
        if(!nullArr){nullArr=[];childrenMap.set(null,nullArr);}
        nullArr.push(t);
      }
    }
    // Remove the containers themselves from the root list
    const newRoots=(childrenMap.get(null)||[]).filter(t=>!containerIds.has(t.id));
    childrenMap.set(null,newRoots);
  }
  // -----------------------------------------------------------------------------

  childrenMap.forEach((arr,k)=>{childrenMap.set(k,sortTopics(arr));});
  const focusMap=new Map();(S.focusLog||[]).forEach(f=>{if(f.topicId)focusMap.set(f.topicId,(focusMap.get(f.topicId)||0)+(f.minutes||0));});
  const groups={};for(let i=0;i<list.length;i++){const t=list[i];(groups[t.subject]=groups[t.subject]||[]).push(t);}
  const order=getSubjectOrder();
  const subs=Object.keys(groups).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return(ia<0?999:ia)-(ib<0?999:ib)||a.localeCompare(b);});
  const el=$("#syl-list");if(!el)return;
  const renderTree=(parentId,depth)=>{
    const kids=childrenMap.get(parentId);if(!kids||!kids.length)return"";
    let html="";
    for(let i=0;i<kids.length;i++){const t=kids[i];const childArr=childrenMap.get(t.id);const hasChildren=!!(childArr&&childArr.length);const isCollapsed=!!sf.closedTopics[t.id];html+=topicRow(t,depth,hasChildren,isCollapsed,childArr?childArr.length:0,focusMap.get(t.id)||0);if(hasChildren&&!isCollapsed)html+=renderTree(t.id,depth+1);}
    return html;
  };
  let out="";
  for(let si=0;si<subs.length;si++){
    const sub=subs[si];const allInSub=groups[sub];const totalCount=allInSub.length;
    let doneCount=0,sumPct=0;for(let i=0;i<allInSub.length;i++){if(allInSub[i].status==="Mastered")doneCount++;sumPct+=statusPct(allInSub[i].status);}
    const avg=totalCount?Math.round(sumPct/totalCount):0;
    const closed=sf.closed[sub];const orderIdx=order.indexOf(sub);const isFirst=orderIdx<=0,isLast=orderIdx>=order.length-1;
    // Root topics under this subject
    const subjectRoots=(childrenMap.get(null)||[]).filter(t=>t.subject===sub);
    const subjectIds=new Set(allInSub.map(t=>t.id));
    const childrenMapSub=new Map();
    childrenMapSub.set(null,subjectRoots);
    childrenMap.forEach((arr,k)=>{if(k===null)return;const filtered=arr.filter(t=>subjectIds.has(t.id));if(filtered.length)childrenMapSub.set(k,filtered);});
    const renderTreeSub=(pid,depth)=>{const kids=childrenMapSub.get(pid);if(!kids||!kids.length)return"";let html="";for(let i=0;i<kids.length;i++){const t=kids[i];const childArr=childrenMapSub.get(t.id);const hasChildren=!!(childArr&&childArr.length);const isCollapsed=!!sf.closedTopics[t.id];html+=topicRow(t,depth,hasChildren,isCollapsed,childArr?childArr.length:0,focusMap.get(t.id)||0);if(hasChildren&&!isCollapsed)html+=renderTreeSub(t.id,depth+1);}return html;};
    const bodyHTML=closed?"":renderTreeSub(null,0);
    out+='<div class="subj-group'+(closed?" closed":"")+'" data-subj="'+esc(sub)+'"><div class="subj-head" data-action="toggle-subj" data-id="'+esc(sub)+'"><i class="sdot" style="background:'+subjColor(sub)+'"></i><b>'+esc(sub)+'</b><span class="cnt">'+doneCount+'/'+totalCount+'</span><div class="pbar"><div class="pfill" style="width:'+avg+'%;background:'+subjColor(sub)+'"></div></div><span class="tiny">'+avg+'%</span><div class="subj-actions"><button class="mini-icon" data-action="subj-up" data-id="'+esc(sub)+'" title="Move up" '+(isFirst?"disabled":"")+'>'+ICONS.up+'</button><button class="mini-icon" data-action="subj-down" data-id="'+esc(sub)+'" title="Move down" '+(isLast?"disabled":"")+'>'+ICONS.down+'</button><button class="mini-icon danger" data-action="del-subject" data-id="'+esc(sub)+'" title="Delete subject">'+ICONS.trash+'</button></div><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg></div><div class="subj-body"'+(closed?" hidden":"")+'>'+bodyHTML+'</div></div>';
  }
  el.innerHTML=out||'<div class="empty"><div class="ic">'+emptyArt("search")+'</div><b>No topics match</b><p>Clear a filter or search term.</p></div>';
  const c=$("#syl-count");if(c)c.textContent=list.length+" of "+S.syllabus.length+" topics";
}

function postErrors(){renderErrList();const t=$("#err-type");if(t)t.addEventListener("click",e=>{const b=e.target.closest("[data-etype]");if(!b)return;ef.type=b.dataset.etype;$$("#err-type .chip").forEach(c=>c.classList.toggle("on",c===b));renderErrList();});const s=$("#err-src");if(s)s.addEventListener("change",e=>{ef.source=e.target.value;renderErrList();});const q=$("#err-q");if(q)q.addEventListener("input",e=>{ef.q=e.target.value.toLowerCase();renderErrList();});}
function errorModal(er,prefillTopicId){openModal(er?"Edit Error":"Log an Error",'<div class="frow"><label>What went wrong?</label><input class="inp" name="title" value="'+esc(er?er.title:"")+'" placeholder="e.g. Mixed up CI vs SI"></div><div class="f2"><div class="frow"><label>Type</label>'+selPlus("type",taxList("errTypes"),er?er.type:"","errTypes","Error type")+'</div><div class="frow"><label>Source</label>'+selPlus("source",taxList("errSources"),er?er.source:"","errSources","Error source")+'</div></div><div class="f2"><div class="frow"><label>Date</label>'+dateFieldHTML("date",(er&&er.date)||todayISO())+'</div><div class="frow"><label>Link</label><input class="inp" name="link" value="'+esc(er?er.link:"")+'" placeholder="Optional"></div></div><div class="frow"><label>Linked topic</label>'+pickerHTML("topicIds",er&&er.topicId?[er.topicId]:(prefillTopicId?[prefillTopicId]:[]),false)+'</div>',v=>{if(!v.title){toast("⚠️ Description required");return false;}const ids=pickVals(v.topicIds);const data={title:v.title,type:v.type,source:v.source,date:v.date||"",link:v.link||"",topicId:ids[0]||null};edit(()=>{if(er)Object.assign(er,data);else S.errors.push(Object.assign({id:uid("e")},data));});toast(er?"Error updated":"Error logged");},er?"Save":"Log");}
function mockChart(){const ms=S.mocks.filter(m=>m.date).sort((a,b)=>a.date<b.date?-1:1);if(!ms.length)return"";const W=680,H=240,PL=38,PR=16,PT=16,PB=30;const X=i=>ms.length===1?PL+(W-PL-PR)/2:PL+i*(W-PL-PR)/(ms.length-1);const Y=v=>PT+(100-Math.max(0,Math.min(100,+v||0)))*(H-PT-PB)/100;const grid=[0,25,50,75,100].map(v=>'<line x1="'+PL+'" y1="'+Y(v)+'" x2="'+(W-PR)+'" y2="'+Y(v)+'" stroke="color-mix(in srgb,var(--text) 6%,transparent)"/><text x="'+(PL-8)+'" y="'+(Y(v)+4)+'" fill="var(--text-3)" font-size="10" text-anchor="end">'+v+'</text>').join("");const xlab=ms.map((m,i)=>'<text x="'+X(i)+'" y="'+(H-8)+'" fill="var(--text-3)" font-size="10" text-anchor="middle">'+fmtD(m.date)+'</text>').join("");const line=(key,color)=>{const pts=ms.map((m,i)=>[X(i),Y(m[key])]);return'<polyline points="'+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+pts.map((p,i)=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" fill="var(--surface)" stroke="'+color+'" stroke-width="2.5"><title>'+esc(ms[i].title)+'</title></circle>').join("");};return'<svg viewBox="0 0 '+W+' '+H+'">'+grid+xlab+line("percentile","var(--accent-2)")+line("accuracy","#10B981")+'</svg>';}
function viewMocks(){const n=S.mocks.length;const avg=k=>n?Math.round(S.mocks.reduce((a,m)=>a+(+m[k]||0),0)/n):0;const best=n?Math.max.apply(null,S.mocks.map(m=>+m.percentile||0)):0;return'<div class="hero-head"><div><h2>Mock <span style="font-style:italic">Tracker</span></h2><div class="sub">Every mock is a mirror.</div></div><button class="btn primary" style="margin-left:auto" data-action="open-add-mock">'+ICONS.plus+' Log Mock</button></div><div class="stat-grid stagger"><div class="stat"><div class="k">Mocks</div><div class="v">'+n+'</div></div><div class="stat"><div class="k">Avg percentile</div><div class="v">'+(n?avg("percentile"):"—")+'</div></div><div class="stat"><div class="k">Avg accuracy</div><div class="v">'+(n?avg("accuracy")+"%":"—")+'</div></div><div class="stat"><div class="k">Best</div><div class="v">'+(n?best:"—")+'</div></div></div>'+(n?'<div class="card section-gap"><div class="card-h"><h2>Trend</h2><div class="legend" style="margin-left:auto"><span><i style="background:var(--accent-2)"></i>Percentile</span><span><i style="background:#10B981"></i>Accuracy</span></div></div><div class="chart-wrap">'+mockChart()+'</div></div>':"")+'<div class="section-gap" style="display:grid;gap:12px">'+(n?S.mocks.slice().sort((a,b)=>(a.date||"")<(b.date||"")?1:-1).map(m=>'<div class="card hover"><div class="sess-top"><div class="sess-name">'+esc(m.title)+'</div><div class="row-actions" style="opacity:1"><button class="mini-icon" data-action="edit-mock" data-id="'+m.id+'">'+ICONS.pencil+'</button><button class="mini-icon danger" data-action="del-mock" data-id="'+m.id+'">'+ICONS.trash+'</button></div></div><div class="sess-meta" style="margin-top:8px"><div class="fld"><label>Date</label><b>'+fmtDY(m.date)+'</b></div><div class="fld"><label>Type</label><span class="pill">'+esc(m.type)+'</span></div><div class="fld"><label>Raw</label><b>'+m.raw+'</b></div><div class="fld"><label>Pct</label><b>'+m.percentile+'</b></div><div class="fld"><label>Acc</label><b>'+m.accuracy+'%</b></div></div>'+(m.weak&&m.weak.length?'<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px"><span class="tiny">Weak →</span>'+m.weak.map(relPill).join("")+'</div>':"")+'</div>').join(""):'<div class="empty"><div class="ic">'+emptyArt("mock")+'</div><b>No mocks yet</b><p>Log your first mock to start tracking the trend.</p></div>')+'</div>';}
function mockModal(m){openModal(m?"Edit Mock":"Log Mock Test",'<div class="frow"><label>Title</label><input class="inp" name="title" value="'+esc(m?m.title:"")+'" placeholder="e.g. CGL PYQ 2025"></div><div class="f2"><div class="frow"><label>Date</label>'+dateFieldHTML("date",(m&&m.date)||todayISO())+'</div><div class="frow"><label>Exam type</label>'+selPlus("type",taxList("mockTypes"),m?m.type:"","mockTypes","Mock type")+'</div></div><div class="f2"><div class="frow"><label>Raw score</label><input class="inp" type="number" step="any" name="raw" value="'+(m?m.raw:"")+'"></div><div class="frow"><label>Percentile</label><input class="inp" type="number" step="any" name="percentile" value="'+(m?m.percentile:"")+'"></div></div><div class="frow"><label>Accuracy %</label><input class="inp" type="number" step="any" name="accuracy" value="'+(m?m.accuracy:"")+'"></div><div class="frow"><label>Weak areas</label>'+pickerHTML("weak",(m&&m.weak)||[],true)+'</div>',v=>{if(!v.title){toast("⚠️ Title required");return false;}const data={title:v.title,date:v.date||todayISO(),type:v.type,raw:parseFloat(v.raw)||0,percentile:parseFloat(v.percentile)||0,accuracy:parseFloat(v.accuracy)||0,weak:pickVals(v.weak)};edit(()=>{if(m)Object.assign(m,data);else S.mocks.push(Object.assign({id:uid("m")},data));});toast(m?"Mock updated":"Mock logged");},m?"Save":"Log");}

function viewTasks(){return'<div class="hero-head"><div><h2>One Step <span style="font-style:italic">Closer</span></h2><div class="sub">Time-block your day. Move tasks across the board.</div></div><button class="btn primary" style="margin-left:auto" data-action="open-add-task">'+ICONS.plus+' Task</button></div><div class="chips-scroll" id="task-chips">'+[["all","All"],["today","Today"],["high","High 🔥"]].map(p=>'<button class="chip'+(tf.f===p[0]?" on":"")+'" data-tf="'+p[0]+'">'+p[1]+'</button>').join("")+'<button class="chip" data-action="task-template">+ Routine template</button></div><div class="board section-gap" id="task-board"></div>';}
function taskCard(t){const od=t.due&&diffD(t.due,todayISO())<0&&t.status!=="Completed";return'<div class="task-card" data-id="'+t.id+'"><div class="tt">'+esc(t.title)+'</div><div class="tm">'+(t.priority?'<span class="pill">'+esc(t.priority)+'</span>':"")+(t.due?'<span class="'+(od?"tag-overdue":diffD(t.due,todayISO())===0?"tag-today":"tag-future")+'">'+fmtD(t.due)+'</span>':"")+(t.tbS?'<span class="tb-chip">⏱ '+esc(t.tbS)+(t.tbE?"–"+esc(t.tbE):"")+'</span>':"")+'</div>'+(t.progress?'<div class="prog">'+esc(t.progress)+'</div>':"")+'<div class="acts">'+(t.status!=="Completed"?'<button class="btn sm '+(t.status==="In Progress"?"green":"")+'" data-action="task-advance" data-id="'+t.id+'">'+(t.status==="In Progress"?"✓ Complete":"▸ Start")+'</button>':'<button class="btn sm ghost" data-action="task-reopen" data-id="'+t.id+'">↺</button>')+'<button class="mini-icon" data-action="gcal-task" data-id="'+t.id+'">'+ICONS.cal+'</button><button class="mini-icon accent" data-action="timer-start-task" data-id="'+t.id+'">⚡</button><button class="mini-icon" data-action="edit-task" data-id="'+t.id+'">'+ICONS.pencil+'</button><button class="mini-icon danger" data-action="del-task" data-id="'+t.id+'">'+ICONS.trash+'</button></div></div>';}
function renderBoard(){const el=$("#task-board");if(!el)return;if(!S.tasks.length){el.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="ic">'+emptyArt("task")+'</div><b>No tasks yet</b><p>Start with a routine template or add a one-off.</p><div class="chips" style="justify-content:center;margin-top:14px"><button class="btn primary" data-action="open-add-task">'+ICONS.plus+' Add task</button><button class="btn" data-action="task-template">Use routine template</button></div></div>';return;}let list=S.tasks;if(tf.f==="today")list=list.filter(t=>t.due===todayISO()||t.tbS);if(tf.f==="high")list=list.filter(t=>(t.priority||"").indexOf("High")===0);el.innerHTML=taxList("taskStatus").map(st=>{const items=list.filter(t=>t.status===st);const dot=st==="Completed"?"#10B981":st==="In Progress"?"#EAB308":"var(--text-3)";return'<div class="bcol"><div class="bcol-h"><i class="sdot" style="width:8px;height:8px;border-radius:2px;background:'+dot+'"></i>'+esc(st)+'<span class="cnt">'+items.length+'</span></div>'+(items.map(taskCard).join("")||'<div class="tiny" style="padding:6px 8px">Nothing here</div>')+'</div>';}).join("");}
function postTasks(){renderBoard();const el=$("#task-chips");if(el)el.addEventListener("click",e=>{const b=e.target.closest("[data-tf]");if(!b)return;tf.f=b.dataset.tf;$$("#task-chips [data-tf]").forEach(c=>c.classList.toggle("on",c===b));renderBoard();});}
function taskModal(t){const sts=taxList("taskStatus");openModal(t?"Edit Task":"New Task",'<div class="frow"><label>Task</label><input class="inp" name="title" value="'+esc(t?t.title:"")+'" placeholder="e.g. GEO+POL"></div><div class="f2"><div class="frow"><label>Status</label>'+selPlus("status",sts,t?t.status:sts[0],"taskStatus","Task status")+'</div><div class="frow"><label>Priority</label><select class="inp" name="priority"><option value="">—</option>'+selOpts(taxList("taskPri"),t?t.priority:"")+'</select></div></div><div class="frow"><label>Due date</label>'+dateFieldHTML("due",(t&&t.due)||"")+'</div><div class="f2"><div class="frow"><label>Time start</label><input class="inp" type="time" name="tbS" value="'+((t&&t.tbS)||"")+'"></div><div class="frow"><label>Time end</label><input class="inp" type="time" name="tbE" value="'+((t&&t.tbE)||"")+'"></div></div><div class="frow"><label>Progress</label><textarea class="inp" name="progress" rows="2">'+esc(t?t.progress:"")+'</textarea></div>',v=>{if(!v.title){toast("⚠️ Task required");return false;}const data={title:v.title,status:v.status,priority:v.priority,due:v.due||"",tbS:v.tbS||"",tbE:v.tbE||"",progress:v.progress||""};edit(()=>{if(t)Object.assign(t,data);else S.tasks.push(Object.assign({id:uid("k")},data));});toast(t?"Task updated":"Task added");},t?"Save":"Add");}
const ROUTINE_TEMPLATE=[{title:"Plan the day",tbS:"05:30",tbE:"06:00",priority:"High 🔥"},{title:"Newspaper",tbS:"07:45",tbE:"08:15",priority:"High 🔥"},{title:"Coaching",tbS:"08:00",tbE:"13:00",priority:"High 🔥"},{title:"Revision block",tbS:"13:15",tbE:"14:15",priority:"High 🔥"},{title:"Current Affairs",tbS:"16:30",tbE:"17:30",priority:"High 🔥"},{title:"Evening study — subject 1",tbS:"18:00",tbE:"21:00",priority:"High 🔥"},{title:"Night study — subject 2",tbS:"21:00",tbE:"23:00",priority:"Medium"}];
function viewHabits(){const start=mondayOf(weekOff),end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+6);const st=weekStats();return'<div class="hero-head"><div><h2>System Over <span style="font-style:italic">Self</span></h2><div class="sub">Log daily study hours. Milestones auto-check. Goal: beat 50%.</div></div><button class="btn" style="margin-left:auto" data-action="edit-habits">'+ICONS.pencil+' Edit habits</button></div><div class="page-tabs">'+[["week","Week"],["month","Month"],["year","Year"]].map(p=>'<div class="page-tab'+(hTab===p[0]?" on":"")+'" data-htab="'+p[0]+'">'+p[1]+'</div>').join("")+'</div>'+(hTab==="week"?viewHabitsWeek(start,end,st):hTab==="month"?viewHabitsMonth():viewHabitsYear());}
function viewHabitsWeek(start,end,st){return'<div class="card"><div class="card-h"><h2>'+fmtD(iso(start))+' – '+fmtD(iso(end))+'</h2><span class="sub" style="display:flex;gap:6px"><button class="btn sm ghost" data-action="week-prev">‹</button><button class="btn sm ghost" data-action="week-today">Now</button><button class="btn sm ghost" data-action="week-next">›</button></span></div><div style="display:flex;align-items:baseline;gap:12px"><span id="wk-pct" style="font-family:var(--font-display);font-size:32px;font-weight:700;letter-spacing:-.03em;color:'+(st.pct>=50?"#10B981":"var(--text)")+'">'+st.pct+'%</span><span class="muted small" id="wk-cnt">'+st.c+' of '+st.total+' actions · goal &gt;50%</span></div><div class="goal-bar"><div class="goal-fill" style="width:'+Math.min(100,st.pct)+'%"></div><div class="goal-marker"><span>50%</span></div></div></div><div class="habit-grid section-gap stagger">'+DAYS.map((d,i)=>{const dd=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),dISO=iso(dd);const dm=S.habits[dISO]||{},ds=dayStats(dISO),isT=dISO===todayISO();return'<div class="hday'+(isT?" today":"")+'" data-daycard="'+i+'"><div class="dh"><b>'+d+'</b><span class="tiny">'+fmtD(dISO)+(isT?" · Today":"")+'</span><span class="pct" data-daypct="'+i+'">'+ds.done+'/'+ds.total+'</span></div>'+(S.habitDefs||[]).map(g=>renderHabitGroup(g,dm,i)).join("")+'</div>';}).join("")+'</div>';}
function viewHabitsMonth(){const now=new Date(),y=now.getFullYear(),m=now.getMonth();const last=new Date(y,m+1,0);const weeks=[];let cur=null;for(let d=1;d<=last.getDate();d++){const dt=new Date(y,m,d);const dow=(dt.getDay()+6)%7;if(!cur||dow===0){cur=[];weeks.push(cur);}cur.push(dt);}const monthLabel=MONTHS[m]+" "+y;let totalDone=0,total=0;weeks.forEach(w=>w.forEach(dt=>{const s=dayStats(iso(dt));totalDone+=s.done;total+=s.total;}));const mpct=total?Math.round(totalDone/total*100):0;return'<div class="card"><div class="card-h"><h2>'+monthLabel+'</h2><span class="sub">'+mpct+'% overall</span></div><div class="goal-bar"><div class="goal-fill" style="width:'+mpct+'%"></div><div class="goal-marker"><span>50%</span></div></div></div><div class="section-gap" style="display:grid;gap:12px">'+weeks.map((w,wi)=>{let wd=0,wt=0;w.forEach(dt=>{const s=dayStats(iso(dt));wd+=s.done;wt+=s.total;});const p=wt?Math.round(wd/wt*100):0;return'<div class="card"><div class="card-h"><h2 style="font-size:14px">Week '+(wi+1)+'</h2><span class="sub">'+wd+'/'+wt+' · '+p+'%</span></div>'+pbar(p,p>=50?"#10B981":"var(--accent-2)")+'<div class="mgrid" style="margin-top:12px">'+w.map(dt=>{const s=dayStats(iso(dt));return'<div class="mcell'+(s.done===0?" zero":"")+'"><div class="d">'+dt.getDate()+'</div><div class="p">'+s.pct+'%</div><div class="b">'+pbar(s.pct,s.pct>=50?"#10B981":"var(--accent-2)")+'</div></div>';}).join("")+'</div></div>';}).join("")+'</div>';}
function viewHabitsYear(){const y=new Date().getFullYear();const start=new Date(y,0,1);const dowStart=(start.getDay()+6)%7;const startAligned=new Date(y,0,1-dowStart);const cells=[];const cur=new Date(startAligned);const end=new Date(y,11,31);while(cur<=end){const dISO=iso(cur);const inYear=cur.getFullYear()===y;const s=inYear?dayStats(dISO):{pct:0};const lvl=s.pct===0?0:s.pct<25?1:s.pct<50?2:s.pct<75?3:4;cells.push({iso:dISO,lvl,inYear,date:new Date(cur),pct:s.pct||0});cur.setDate(cur.getDate()+1);}let yrDone=0,yrTotal=0;for(let mi=0;mi<12;mi++){const last=new Date(y,mi+1,0);for(let d=1;d<=last.getDate();d++){const s=dayStats(iso(new Date(y,mi,d)));yrDone+=s.done;yrTotal+=s.total;}}const ypct=yrTotal?Math.round(yrDone/yrTotal*100):0;const monthLabels=[];for(let mi=0;mi<12;mi++){const dt=new Date(y,mi,1);const idx=Math.round((dt-startAligned)/86400000/7);monthLabels.push({label:MONTHS[mi],week:idx});}return'<div class="card"><div class="card-h"><h2>'+y+' Heatmap</h2><span class="sub">'+ypct+'% overall</span></div><div class="goal-bar"><div class="goal-fill" style="width:'+ypct+'%"></div><div class="goal-marker"><span>50%</span></div></div><div class="hm-wrap" style="margin-top:20px"><div style="display:flex;gap:6px;min-width:max-content"><div style="display:flex;flex-direction:column;justify-content:space-between;font-size:9.5px;color:var(--text-3);padding:2px 0;height:calc(7 * 11px + 6 * 3px);line-height:11px"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span></div><div><div style="display:flex;gap:3px;margin-bottom:6px;font-size:10px;color:var(--text-3);position:relative;height:12px">'+monthLabels.map(m=>'<span style="position:absolute;left:'+(m.week*14)+'px">'+m.label+'</span>').join("")+'</div><div class="hm">'+cells.map(c=>'<i class="l'+c.lvl+'" title="'+fmtDY(c.iso)+' — '+c.pct+'%" style="'+(c.inYear?"":"opacity:.2")+'"></i>').join("")+'</div></div></div><div class="hm-legend"><span>Less</span><i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>More</span></div></div></div>';}

function dismissWelcome(){S.settings.welcomeDone=true;store.set(KEY,JSON.stringify(S));const r=$("#welcome-root");if(r)r.innerHTML="";}
function ensureClearWrap(inp){if(inp._clearAttached)return;if(!inp.parentNode)return;const p=inp.parentNode;if(!p.classList)return;if(p.classList.contains("date-field")||p.classList.contains("inp-wrap")||p.classList.contains("hours-inp"))return;const t=(inp.type||"").toLowerCase();if(["hidden","file","checkbox","radio","date","time","color","range","submit","button","image","password","number"].indexOf(t)>-1)return;if(inp.tagName!=="INPUT"&&inp.tagName!=="TEXTAREA")return;if(inp.hasAttribute("data-noclear"))return;inp._clearAttached=true;const wrap=document.createElement("span");wrap.className="inp-wrap";p.insertBefore(wrap,inp);wrap.appendChild(inp);const btn=document.createElement("button");btn.type="button";btn.className="inp-clear";btn.setAttribute("aria-label","Clear field");btn.textContent="×";btn.addEventListener("mousedown",ev=>ev.preventDefault());btn.addEventListener("click",ev=>{ev.preventDefault();ev.stopPropagation();inp.value="";inp.classList.remove("has-value");try{inp.dispatchEvent(new Event("input",{bubbles:true}));inp.dispatchEvent(new Event("change",{bubbles:true}));}catch(err){}inp.focus();updateClearState(inp);});wrap.appendChild(btn);inp._clearBtn=btn;const update=()=>updateClearState(inp);inp.addEventListener("input",update);inp.addEventListener("change",update);update();}
function updateClearState(inp){if(!inp._clearBtn)return;if(inp.value&&inp.value.length){inp.classList.add("has-value");}else{inp.classList.remove("has-value");}}
document.addEventListener("focusin",e=>{const el=e.target;if(!el||!el.classList)return;if(el.classList.contains("inp"))ensureClearWrap(el);});
document.addEventListener("input",e=>{const el=e.target;if(el&&el.classList&&el.classList.contains("inp"))updateClearState(el);const hours=e.target.closest("[data-hours-day]");if(hours){const dayIdx=parseInt(hours.dataset.hoursDay,10);const val=Math.max(0,Math.min(24,parseFloat(hours.value)||0));const start=mondayOf(weekOff);const dISO=iso(new Date(start.getFullYear(),start.getMonth(),start.getDate()+dayIdx));if(!S.habits[dISO])S.habits[dISO]={};S.habits[dISO].hours=val;store.set(KEY,JSON.stringify(S));const card=hours.closest("[data-daycard]");if(card){card.querySelectorAll(".hours-milestone").forEach(elm=>{const thr=parseFloat(elm.dataset.threshold);elm.classList.toggle("on",val>=thr);});const hd=card.querySelector('[data-hours-display="'+dayIdx+'"]');if(hd)hd.textContent=val;const ds=dayStats(dISO);const dp=card.querySelector("[data-daypct]");if(dp)dp.textContent=ds.done+"/"+ds.total;}const st=weekStats();const pv=$("#wk-pct");if(pv){pv.textContent=st.pct+"%";pv.style.color=st.pct>=50?"#10B981":"var(--text)";}const pc=$("#wk-cnt");if(pc)pc.textContent=st.c+" of "+st.total+" actions · goal >50%";const gf=document.querySelector(".goal-fill");if(gf)gf.style.width=Math.min(100,st.pct)+"%";updateBadges();queueSync();return;}});

  const hdAddI=e.target.closest("[data-hd-addi]");if(hdAddI){const gid=hdAddI.dataset.hdAddi;snapshot();S.habitDefs.forEach(g=>{if(g.id===gid&&Array.isArray(g.items))g.items.push({id:uid("hi"),label:"New item"});});saveLocal();renderHDList();return;}
  const b=e.target.closest("[data-nav]");if(b){if(!b.classList.contains("nav-info")){e.preventDefault();closeSheet();go(b.dataset.nav);return;}}
  const ht=e.target.closest("[data-htab]");if(ht){e.preventDefault();hTab=ht.dataset.htab;rerender();return;}
  const el=e.target.closest("[data-action]");if(el&&!el.disabled){const fn=ACTIONS[el.dataset.action];if(fn){e.preventDefault();fn(el.dataset.id,el,e);return;}}
});

document.addEventListener("keydown",e=>{const tag=(e.target.tagName||"").toLowerCase();const typing=tag==="input"||tag==="textarea"||e.target.isContentEditable;if((e.metaKey||e.ctrlKey)&&e.key==="z"&&!e.shiftKey){if(typing)return;e.preventDefault();undo();return;}if(typing||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==="s"||e.key==="S"){e.preventDefault();openScratch();return;}if(e.key==="f"||e.key==="F"){e.preventDefault();if(!FS.panel&&!FS.zen)focusPanelOpen();else{focusPanelClose();focusZen(false);}return;}if(e.key==="\\"){e.preventDefault();toggleSidebar();return;}});

// ── Cleanup legacy localStorage keys ──
(function cleanupLegacyKeys(){
  try{
    // Make sure current state is safely persisted first
    store.set(KEY,JSON.stringify(S));
    let freed=0,removed=[];
    (OLD_KEYS||[]).forEach(k=>{
      if(k===KEY)return;
      const v=localStorage.getItem(k);
      if(v){
        freed+=v.length;
        localStorage.removeItem(k);
        removed.push(k);
      }
    });
    if(removed.length){
      const kb=Math.round(freed/1024);
      console.log("[Apex] Cleaned "+removed.length+" legacy keys ("+removed.join(", ")+"), freed ~"+kb+" KB");
    }else{
      console.log("[Apex] No legacy keys to clean.");
    }
  }catch(e){console.warn("[Apex] Cleanup skipped:",e.message);}
})();
