function reorderTopic(draggedId,targetId,subject){const sibs=sortTopics(S.syllabus.filter(x=>x.subject===subject));const from=sibs.findIndex(x=>x.id===draggedId);const to=sibs.findIndex(x=>x.id===targetId);if(from<0||to<0||from===to)return;snapshot();const moved=sibs.splice(from,1)[0];sibs.splice(to,0,moved);sibs.forEach((x,i)=>{x.order=i;});saveLocal();renderSylList();}

"fs-merge":async()=>{
  try{
    const snap=await firebase.firestore().collection("exam_os_rooms").doc(S.sync.room).get();
    if(snap.exists&&snap.data().enc){
      const remote=await decryptState(snap.data().enc);
      _applyingRemote=true;
      S=mergeForSync(S,remote);
      S.schemaVersion=SCHEMA_VERSION;
      S.sync={enabled:true,room:S.sync.room};
      _applyingRemote=false;
      store.set(KEY,JSON.stringify(S));
      applyTheme(S.settings.theme||"obsidian");
      rerender();
    }
    closeModal();
    await pushNow(true);
    startSync();
    toast("Merged ✓","Both sides combined · syncing now");
  }catch(e){toast("⚠️ Merge failed",e.message);}
},

    root.style.setProperty("--my",ry.toFixed(1)+"px");

  document.addEventListener("mouseleave",()=>{mx=window.innerWidth/2;my=window.innerHeight/2;if(!raf)raf=requestAnimationFrame(tick);});

  }

function renderMath(str){
  if(!str)return"";
  if(!window.katex)return esc(str);
  const src=String(str);
  const out=[];
  const pattern=/\$\$([\s\S]+?)\$\$|\\\(([\s\S]+?)\\\)/g;
  let last=0,m;
  while((m=pattern.exec(src))!==null){
    if(m.index>last)out.push(esc(src.slice(last,m.index)));
    const expr=(m[1]||m[2]).trim();
    const isDisplay=!!m[1];
    try{
      out.push(window.katex.renderToString(expr,{displayMode:isDisplay,throwOnError:false,output:"html"}));
    }catch(e){
      out.push(esc(m[0]));
    }
    last=m.index+m[0].length;
  }

async function pushNow(silent){
  if(!S.sync.enabled||!S.sync.room||!syncKey)return;
  try{
    setSyncStatus("syncing");
    if(!await initFirebase()){setSyncStatus("error");if(!silent)toast("⚠️ Firebase not configured");return;}
    const db=firebase.firestore();
    const ref=db.collection("exam_os_rooms").doc(S.sync.room);
    let needMerge=false;
    try{
      const snap=await ref.get();
      if(snap.exists){
        const data=snap.data();
        if(data&&data.updatedAt&&S._lastSync&&data.updatedAt>S._lastSync&&S._lastLocalEdit&&S._lastLocalEdit>S._lastSync){
          needMerge=true;
          let remote=null;
          try{remote=await decryptState(data.enc);}catch(e){}
          if(remote){
            S=mergeForSync(S,remote);
            if(!silent)toast("🔀 Merged with cloud","Local + cloud preserved");
          }
        }
      }
    }catch(e){}
    const payload=JSON.parse(JSON.stringify(S));
    delete payload.sync;
    delete payload._lastSync;
    const encrypted=await encryptState(payload);
    const now=new Date().toISOString();
    await ref.set({enc:encrypted,updatedAt:now,salt:bufToB64(syncSalt)});
    S._lastSync=now;
    store.set(KEY,JSON.stringify(S));
    setSyncStatus("synced");
    if(!silent&&!needMerge)toast("☁️ Pushed (encrypted)");
    if(!silent&&needMerge)rerender();
  }catch(e){
    setSyncStatus("error");
    if(!silent)toast("⚠️ Push failed",e.message);
  }

function getDeviceId(){if(!S._deviceId){S._deviceId="dev-"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}return S._deviceId;}
function mergeForSync(local,remote){
  const mergeById=(a,b)=>{
    if(!Array.isArray(a)&&!Array.isArray(b))return a||b||[];
    if(!Array.isArray(a))return b||[];
    if(!Array.isArray(b))return a||[];
    const map=new Map();
    b.forEach(x=>{if(x&&x.id)map.set(x.id,x);});
    a.forEach(x=>{if(x&&x.id)map.set(x.id,x);});
    return [...map.values()];
  };
  const out=Object.assign({},remote,local);
  out._deviceId=local._deviceId||remote._deviceId;
  out._lastLocalEdit=local._lastLocalEdit||remote._lastLocalEdit;
  out._lastSync=new Date().toISOString();
  ["syllabus","sessions","errors","mocks","tasks","links","focusLog","scratch","resources"].forEach(k=>{
    out[k]=mergeById(local[k],remote[k]);
  });
  out.habits=Object.assign({},remote.habits||{});
  Object.keys(local.habits||{}).forEach(date=>{
    if(!out.habits[date])out.habits[date]=local.habits[date];
    else out.habits[date]=Object.assign({},out.habits[date],local.habits[date]);
  });
  out.tax=Object.assign({},remote.tax||{});
  Object.keys(local.tax||{}).forEach(k=>{
    const set=new Set([...(out.tax[k]||[]),...(local.tax[k]||[])]);
    out.tax[k]=[...set];
  });
  out.habitDefs=local.habitDefs&&local.habitDefs.length?local.habitDefs:(remote.habitDefs||[]);
  out.settings=Object.assign({},remote.settings||{},local.settings||{});
  out.sync=local.sync||remote.sync;
  return out;
}

<script>
/* Apex Folder Export v1 - File System Access API */
;(function(){
try{
  if(window._apexFolderExport) return;
  window._apexFolderExport = true;

  var IDB_STORE = "handles";
  var HANDLE_KEY = "exportDir";
  var FILE_PATTERN = /^apex-backup-.*\.json$/i;

  function openDB(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = function(){ resolve(req.result); };

    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(IDB_STORE, "readwrite");

        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(IDB_STORE, "readonly");

        r.onsuccess = function(){ resolve(r.result); };
        r.onerror = function(){ reject(r.error); };
      });
    });
  }

    return openDB().then(function(db){
      return new Promise(function(resolve){

        var secs = [].slice.call(modal.querySelectorAll(".sett-section"));
        var ds = secs.filter(function(s){
          var h = s.querySelector("h4");
          return h && /^Data/i.test(h.textContent);
        })[0];
        if(!ds) return;
        if(ds.querySelector(".apex-folder-row")) return;

        var row = document.createElement("div");
        row.className = "apex-folder-row";
        row.style.cssText = "margin-top:12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)";

        var title = document.createElement("div");
        title.style.cssText = "font-family:JetBrains Mono,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px";
        title.textContent = "Export folder (Chrome / Edge)";
        row.appendChild(title);

        var status = document.createElement("div");
        status.style.cssText = "font-size:11.5px;color:var(--text-2);line-height:1.5;margin-bottom:8px";
        status.textContent = "Loading...";
        row.appendChild(status);

        var btns = document.createElement("div");
        btns.className = "chips";
        row.appendChild(btns);

        ds.appendChild(row);

        getFolder().then(function(handle){
          var has = !!handle;
          var sup = isSupported();
          status.textContent = !sup
            ? "Not supported in this browser. Chrome or Edge only. Falls back to normal downloads."
            : (has ? "Set. Backups write here and old files are replaced automatically." : "Not set. Export downloads to your default Downloads folder.");

          if(sup){
            var b1 = document.createElement("button");
            b1.className = "btn";
            b1.setAttribute("data-action","choose-export-folder");
            b1.textContent = has ? "Change folder" : "Choose folder";
            btns.appendChild(b1);

            if(has){
              var b2 = document.createElement("button");
              b2.className = "btn ghost";
              b2.setAttribute("data-action","clear-export-folder");
              b2.textContent = "Clear";
              btns.appendChild(b2);
            }
          }
        });
      }, 90);
    };
  }

  console.log("[Apex Folder Export] installed · supported:", isSupported());
}catch(e){ console.error("[Apex Folder Export]", e); }
})();
</script>

<script>
/* Apex Sync Integrity v1 - _ts + tombstones + ts-aware merge */
;(function(){
try{
  if(window._apexSyncIntegrity)return;
  if(typeof S==="undefined"||typeof ACTIONS==="undefined")return;
  window._apexSyncIntegrity=true;

  var COLLECTIONS = ["syllabus","sessions","errors","mocks","tasks","links","scratch","focusLog"];
  var _hashes = {};

  function _simpleHash(s){
    var h=0;
    for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}
    return h;
  }
  function _hashable(rec){
    var c = Object.assign({},rec);
    delete c._ts;
    return c;
  }
  function primeHashes(){
    COLLECTIONS.forEach(function(coll){
      if(!Array.isArray(S[coll]))return;
      if(!_hashes[coll])_hashes[coll]={};
      S[coll].forEach(function(rec){
        if(!rec||!rec.id)return;
        _hashes[coll][rec.id] = _simpleHash(JSON.stringify(_hashable(rec)));
      });
    });
  }
  function stampChanges(){
    var nowMs = Date.now();
    COLLECTIONS.forEach(function(coll){
      if(!Array.isArray(S[coll]))return;
      if(!_hashes[coll])_hashes[coll]={};
      var hashes = _hashes[coll];
      var seen = {};
      S[coll].forEach(function(rec){
        if(!rec||!rec.id)return;
        seen[rec.id]=true;
        var h = _simpleHash(JSON.stringify(_hashable(rec)));
        if(hashes[rec.id] !== h){
          rec._ts = nowMs;
          hashes[rec.id] = h;
        }
      });
      Object.keys(hashes).forEach(function(id){if(!seen[id])delete hashes[id];});
    });
  }

  // Tombstones init
  if(!S.tombstones||typeof S.tombstones!=="object")S.tombstones={};
  COLLECTIONS.forEach(function(coll){
    if(!S.tombstones[coll]||typeof S.tombstones[coll]!=="object")S.tombstones[coll]={};
  });

  primeHashes();

  // Wrap saveLocal
  var _origSave = window.saveLocal;
  window.saveLocal = function(){
    try{stampChanges();}catch(e){}
    return _origSave.apply(this,arguments);
  };

  // Full replacement of mergeForSync with _ts-aware resolution
  window.mergeForSync = function(local, remote){
    function mergeByIdTs(a,b){
      if(!Array.isArray(a)&&!Array.isArray(b))return a||b||[];
      if(!Array.isArray(a))return b||[];
      if(!Array.isArray(b))return a||[];
      var map = new Map();
      b.forEach(function(x){if(x&&x.id)map.set(x.id,x);});
      a.forEach(function(x){
        if(!x||!x.id)return;
        var ex = map.get(x.id);
        if(!ex){map.set(x.id,x);return;}
        var tA = x._ts||0, tB = ex._ts||0;
        if(tA >= tB)map.set(x.id,x);
      });
      return Array.from(map.values());
    }
    var out = Object.assign({},remote,local);
    out._deviceId = local._deviceId||remote._deviceId;
    out._lastLocalEdit = local._lastLocalEdit||remote._lastLocalEdit;
    out._lastSync = new Date().toISOString();

    COLLECTIONS.forEach(function(k){
      out[k] = mergeByIdTs(local[k], remote[k]);
    });

    // Union tombstones (newer delete wins)
    out.tombstones = {};
    COLLECTIONS.forEach(function(coll){
      var merged = Object.assign({},
        (remote.tombstones&&remote.tombstones[coll])||{},
        (local.tombstones&&local.tombstones[coll])||{}
      );
      var rt = (remote.tombstones&&remote.tombstones[coll])||{};
      Object.keys(rt).forEach(function(id){
        if(!merged[id]||rt[id]>merged[id])merged[id]=rt[id];
      });
      out.tombstones[coll]=merged;
    });

    // Drop any record whose _ts <= its tombstone time
    COLLECTIONS.forEach(function(coll){
      if(!Array.isArray(out[coll]))return;
      var t = out.tombstones[coll]||{};
      out[coll] = out[coll].filter(function(rec){
        if(!rec||!rec.id)return true;
        var ts = rec._ts||0;
        var del = t[rec.id]||0;
        return !(del && ts <= del);
      });
    });

    out.habits = Object.assign({}, remote.habits||{});
    Object.keys(local.habits||{}).forEach(function(date){
      if(!out.habits[date])out.habits[date]=local.habits[date];
      else out.habits[date]=Object.assign({},out.habits[date],local.habits[date]);
    });
    out.tax = Object.assign({}, remote.tax||{});
    Object.keys(local.tax||{}).forEach(function(k){
      var s = new Set([].concat(out.tax[k]||[], local.tax[k]||[]));
      out.tax[k] = Array.from(s);
    });
    out.habitDefs = local.habitDefs && local.habitDefs.length ? local.habitDefs : (remote.habitDefs||[]);
    out.settings = Object.assign({}, remote.settings||{}, local.settings||{});
    out.sync = local.sync||remote.sync;
    return out;
  };

  // Wrap delete actions to record tombstones
  var DELETABLE = {
    "del-session":"sessions",
    "del-error":"errors",
    "del-mock":"mocks",
    "del-task":"tasks",
    "del-link":"links",
    "hard-del-topic":"syllabus",
    "del-subject":"syllabus"
  };
  Object.keys(DELETABLE).forEach(function(action){
    var _origAction = ACTIONS[action];
    if(typeof _origAction !== "function")return;
    var coll = DELETABLE[action];
    ACTIONS[action] = function(id){
      var before = Array.isArray(S[coll]) ? S[coll].slice() : null;
      var result = _origAction.apply(this, arguments);
      if(!before)return result;
      var after = {};
      (S[coll]||[]).forEach(function(r){if(r&&r.id)after[r.id]=true;});
      var nowMs = Date.now();
      var anyDeleted = false;
      before.forEach(function(r){
        if(r&&r.id&&!after[r.id]){
          if(!S.tombstones)S.tombstones={};
          if(!S.tombstones[coll])S.tombstones[coll]={};
          S.tombstones[coll][r.id]=nowMs;
          anyDeleted = true;
        }
      });
      if(anyDeleted){
        S._lastLocalEdit = new Date().toISOString();
        try{store.set(KEY, JSON.stringify(S));}catch(e){}
        queueSync();
      }
      return result;
    };
  });

  console.log("[Apex Sync Integrity] installed · tombstones + _ts active");
}catch(e){console.error("[Apex Sync Integrity]",e);}
})();
</script>
<script>

  var isFile = location.protocol === "file:";
  if(!("serviceWorker" in navigator)){
    console.log("[Apex PWA] service worker unsupported");
    return;
  }
  if(isFile){
    console.log("[Apex PWA] file:// origin — service worker disabled. Host over http(s) to enable.");
  } else {
  navigator.serviceWorker.register("./sw.js", {scope:"./"})
    .then(function(){ console.log("[Apex PWA] service worker registered"); })
    .catch(function(e){ console.log("[Apex PWA] SW registration failed:", e.message); });
}
  var deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();

  });
  window.apexInstall = function(){
