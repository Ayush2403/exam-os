*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:14.5px/1.55 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden;transition:background .3s var(--ease),color .3s var(--ease)}
::selection{background:var(--accent-glow);color:var(--text)}
h1,h2,h3,h4,.brand b,.hero-head h2,.card-h h2,.modal h3,.next-action .t,.stat .v{font-family:var(--font-display);letter-spacing:-.02em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--text)}
a{color:var(--text);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
#errbar{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#3a1f1d;color:#ffb3aa;border-bottom:1px solid rgba(239,68,68,.5);padding:10px 16px;font-size:12.5px;font-weight:600;white-space:pre-wrap}
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar-w);flex:0 0 auto;position:fixed;inset:0 auto 0 0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:24px 12px 16px;background:var(--surface);border-right:1px solid var(--border);z-index:40;transition:transform .34s var(--ease-out),background .3s,border-color .3s;will-change:transform}
body.sb-collapsed #sidebar{transform:translateX(-100%)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 24px}
.brand .mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.06);color:var(--btn-primary-fg);font-family:var(--font-display);font-weight:700}
.brand b{font-size:15px;font-weight:700;display:block;line-height:1.1;letter-spacing:-.01em}
.brand span{font-size:10px;color:var(--text-3);letter-spacing:.09em;text-transform:uppercase;font-weight:600;font-family:"Inter",sans-serif}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px 9px 12px;border-radius:var(--r-sm);color:var(--text-2);font-size:13.5px;font-weight:500;position:relative;transition:all .2s var(--ease);width:100%;text-align:left;cursor:pointer;user-select:none}
.nav-item>svg{width:17px;height:17px;flex:0 0 auto;opacity:.75;transition:opacity .2s,transform .25s var(--ease-out)}
.nav-item>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item:hover>svg{transform:scale(1.08)}
.nav-item:active{transform:scale(.98)}
.nav-item.active{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.nav-item.active>svg{color:var(--accent-2);opacity:1}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:24%;bottom:24%;width:2px;border-radius:2px;background:var(--accent-2)}
.nav-info{margin-left:6px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;color:var(--text-3);font-size:10.5px;font-weight:700;font-family:"Inter",sans-serif;font-style:normal;line-height:1;border:1.5px solid var(--border-2);background:transparent;opacity:.5;transition:opacity .18s,color .15s,border-color .15s,transform .2s var(--ease-out),background .15s;flex-shrink:0;cursor:help;padding:0}
.nav-item:hover .nav-info{opacity:.95}
.nav-info:hover{opacity:1!important;color:var(--accent-2);border-color:var(--accent-2);background:var(--accent-glow);transform:scale(1.12)}
.nav-badge{font-size:10.5px;font-weight:700;background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.25);min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;font-family:"Inter",sans-serif;flex-shrink:0}
.side-foot{margin-top:auto;padding:12px 4px 2px;border-top:1px solid var(--border);display:flex;gap:6px}
#main{flex:1;margin-left:var(--sidebar-w);min-width:0;transition:margin-left .34s var(--ease-out);display:flex;flex-direction:column}
body.sb-collapsed #main{margin-left:0}
#topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:14px 34px 12px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
#page-title{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.date-chip{font-size:12.5px;color:var(--text-2);padding:6px 12px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);transition:all .22s var(--ease)}
.date-chip:hover{color:var(--text);border-color:var(--border-2);transform:translateY(-1px)}
.streak-chip{font-size:12.5px;font-weight:600;color:#F59E0B;padding:6px 11px;border-radius:var(--r-pill);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-family:"Inter",sans-serif;transition:all .24s var(--ease)}
.streak-chip svg{width:13px;height:13px;transition:transform .38s var(--ease-out)}
.streak-chip:hover{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.45);transform:translateY(-2px);box-shadow:0 6px 18px rgba(245,158,11,.22)}
.streak-chip:hover svg{transform:scale(1.18) rotate(-8deg)}
.icon-btn{width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2);border:1px solid var(--border);background:var(--surface);transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .2s,border-color .2s,color .2s;flex-shrink:0;position:relative;overflow:hidden}
.icon-btn::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 50%,var(--accent-glow),transparent 72%);opacity:0;transition:opacity .3s var(--ease);pointer-events:none}
.icon-btn:hover::after{opacity:1}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-2);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.16)}
.icon-btn:active{transform:scale(.92);box-shadow:none}
.icon-btn svg{width:16px;height:16px;transition:transform .32s var(--ease-out)}
.icon-btn:hover svg{transform:scale(1.14)}
#settings-btn:hover svg{transform:rotate(65deg) scale(1.1)}
#help-btn:hover svg{transform:scale(1.12) rotate(-7deg)}
.sb-toggle.on{color:var(--accent-2);border-color:var(--accent-2);background:var(--accent-glow)}
.sync-pill,.timer-pill{font-size:12px;font-weight:600;padding:7px 12px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .2s,border-color .2s,color .2s;color:var(--text-2);white-space:nowrap;flex-shrink:0;font-family:"Inter",sans-serif;min-height:36px}
.sync-pill:hover,.timer-pill:hover{background:var(--surface-2);border-color:var(--border-2);color:var(--text);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.14)}
.sync-pill:active,.timer-pill:active{transform:scale(.95)}
.sync-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex-shrink:0;transition:background .3s}
.sync-pill.synced .dot{background:#10B981;animation:dotGlow 2.6s ease-in-out infinite}
.sync-pill.syncing .dot,.sync-pill.connecting .dot{background:#F59E0B;animation:pulse 1.2s infinite}
.sync-pill.error .dot{background:#EF4444}
.sync-pill.locked .dot{background:#A855F7}
@keyframes dotGlow{0%,100%{box-shadow:0 0 5px rgba(16,185,129,.5)}50%{box-shadow:0 0 12px rgba(16,185,129,.95)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.timer-pill svg{transition:transform .35s var(--ease-out)}
.timer-pill:hover svg{transform:scale(1.15)}
.timer-pill.running{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fca5a5}
.timer-pill.running svg{animation:spin 8s linear infinite}
.timer-pill.running:hover{box-shadow:0 6px 18px rgba(239,68,68,.22)}
.timer-pill.paused{border-color:var(--border-2);color:var(--text-2)}

.sess-name{font-size:14px;font-weight:600;letter-spacing:-.005em;flex:1;min-width:0}
.sess-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
.sess-meta b{color:var(--text);font-weight:600}
.sess-meta .fld{display:flex;flex-direction:column;gap:4px;min-width:120px}
.sess-meta .fld label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);font-weight:600;font-family:"Inter",sans-serif}
.date-grp{margin-top:18px}
.date-grp-h{font-size:11.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;font-family:"Inter",sans-serif}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.bcol{background:color-mix(in srgb,var(--text) 2%,transparent);border:1px solid var(--border);border-radius:var(--r);padding:14px;min-height:120px}
.bcol-h{display:flex;align-items:center;gap:8px;padding:2px 6px 14px;font-size:12.5px;font-weight:700;letter-spacing:.02em;font-family:"Inter",sans-serif}
.bcol-h .cnt{margin-left:auto;font-size:11px;color:var(--text-3);background:var(--surface-2);border-radius:var(--r-pill);padding:2px 8px}
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px;margin-bottom:10px;transition:all .18s var(--ease)}
.task-card:hover{border-color:var(--border-2);background:var(--surface-2);transform:translateY(-1px)}
.task-card .tt{font-size:13.5px;font-weight:600;line-height:1.35}
.task-card .tm{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.task-card .prog{font-size:12px;color:var(--text-2);margin-top:10px;background:var(--surface-2);border-radius:6px;padding:8px 10px;border:1px solid var(--border)}
.task-card .acts{display:flex;gap:6px;margin-top:12px;align-items:center;flex-wrap:wrap}
.tb-chip{font-size:11px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:var(--r-pill);font-weight:600;white-space:nowrap;font-family:"Inter",sans-serif}
.habit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.hday{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;transition:all .2s var(--ease)}
.hday.today{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-glow)}
.hday .dh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hday .dh b{font-size:13.5px;font-weight:700;font-family:var(--font-display)}
.hday .dh .pct{margin-left:auto;font-size:12px;font-weight:600;color:var(--text-2);font-family:"Inter",sans-serif}
.hgroup{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--text-3);text-transform:uppercase;margin:12px 0 6px;font-family:"Inter",sans-serif}
.hcheck{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:6px;cursor:pointer;user-select:none;transition:background .18s;font-size:13px;color:var(--text-2);min-height:40px}
.hcheck:hover{background:var(--surface-2)}
.hcheck .box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border-2);display:grid;place-items:center;transition:all .2s var(--ease-out);flex-shrink:0}
.hcheck .box svg{width:12px;height:12px;opacity:0;transform:scale(.5);transition:all .2s var(--ease-out);color:var(--btn-primary-fg)}
.hcheck.on{color:var(--text)}
.hcheck.on .box{background:var(--accent-2);border-color:var(--accent-2);transform:scale(1.05)}
.hcheck.on .box svg{opacity:1;transform:scale(1)}
.goal-bar{position:relative;height:6px;border-radius:99px;background:color-mix(in srgb,var(--text) 8%,transparent);overflow:visible;margin:20px 0 8px}
.goal-fill{height:100%;border-radius:99px;background:var(--accent-2);transition:width .5s var(--ease-out)}
.goal-marker{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--text-3);left:50%}
.goal-marker span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--text-3);white-space:nowrap;font-family:"Inter",sans-serif}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.mcell{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 8px;text-align:center;transition:all .18s}
.mcell:hover{border-color:var(--border-2);transform:translateY(-1px)}
.mcell .d{font-size:11px;font-weight:600;color:var(--text-3);font-family:"Inter",sans-serif}
.mcell .p{font-family:var(--font-display);font-size:15px;font-weight:700;margin-top:3px}
.mcell .b{margin-top:6px}
.mcell.zero{opacity:.35}
.hm-wrap{overflow-x:auto;padding:4px 0}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;min-width:max-content}
.hm i{width:11px;height:11px;border-radius:2px;background:color-mix(in srgb,var(--text) 6%,transparent);display:block;cursor:pointer;transition:all .18s}
.hm i:hover{outline:1px solid var(--text-3);outline-offset:1px}
.hm i.l1{background:color-mix(in srgb,var(--accent-2) 30%,transparent)}
.hm i.l2{background:color-mix(in srgb,var(--accent-2) 50%,transparent)}
.hm i.l3{background:color-mix(in srgb,var(--accent-2) 70%,transparent)}
.hm i.l4{background:var(--accent-2)}
.hm-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);margin-top:10px;font-family:"Inter",sans-serif}
.hm-legend i{width:11px;height:11px;border-radius:2px;display:block}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:4px;height:150px}
.ws-day{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.ws-name{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;font-family:"Inter",sans-serif}
.ws-bar{flex:1;width:100%;max-width:36px;background:color-mix(in srgb,var(--text) 5%,transparent);border-radius:8px;position:relative;overflow:hidden}
.ws-fill{position:absolute;bottom:0;left:0;right:0;border-radius:8px;transition:height .6s var(--ease-out),background .3s;min-height:3px;background:var(--accent-2)}
.ws-num{font-size:10px;font-weight:600;color:var(--text-3);font-variant-numeric:tabular-nums;font-family:"Inter",sans-serif}
.ws-day.today .ws-name{color:var(--text)}
.ws-day.today .ws-bar{outline:1px solid var(--accent-2);outline-offset:2px}
.chart-wrap{width:100%;overflow-x:auto}
.chart-wrap svg{min-width:520px;width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text-2);font-family:"Inter",sans-serif}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px}
#modal-root:empty{display:none}
.overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .22s var(--ease-out)}
.modal{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-lg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:28px;animation:popIn .28s var(--ease-out);box-shadow:0 16px 48px rgba(0,0,0,.35)}
@keyframes popIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.modal h3{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:20px}
.modal .sub-h{font-size:12.5px;font-weight:600;color:var(--text-3);margin-bottom:16px;margin-top:-10px;font-family:"Inter",sans-serif}
.sett-section{border-top:1px solid var(--border);padding-top:18px;margin-top:18px}
.sett-section:first-of-type{border-top:none;padding-top:0;margin-top:0}
.sett-section h4{font-family:"Inter",sans-serif;font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px}
.tax-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;background:var(--surface-2);margin-bottom:4px;border:1px solid transparent}
.tax-row:hover{background:var(--surface-3);border-color:var(--border)}
.tax-row .grow{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow{margin-bottom:14px}
.frow label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;font-family:"Inter",sans-serif}
.frow .hint{font-size:11px;color:var(--text-3);margin-top:6px;line-height:1.5;font-family:"Inter",sans-serif}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;position:sticky;bottom:-28px;background:var(--surface);padding:16px 0 0;border-top:1px solid var(--border)}
.tpick{position:relative}
.pick-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;margin-bottom:10px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm)}
.pick-chips:empty{display:none}
.pick-chips .pill .x{cursor:pointer;margin-left:4px;opacity:.6;font-weight:700;font-size:14px;line-height:1}
.pick-chips .pill .x:hover{opacity:1}
.pick-toolbar{display:flex;gap:8px;align-items:center;margin:8px 0 6px;font-size:11.5px;color:var(--text-3);font-family:"Inter",sans-serif}
.pick-toolbar .count{flex:1}
.pick-toolbar button{font-size:11.5px;font-weight:600;color:var(--text-2);padding:4px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);transition:all .15s;font-family:"Inter",sans-serif}
.pick-toolbar button:hover{background:var(--surface-3);color:var(--text);border-color:var(--border-2)}
.picker-list{max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2)}
.pick-group{border-bottom:1px solid var(--border)}
.pick-group:last-child{border-bottom:none}
.pick-group-h{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;font-size:13px;user-select:none;transition:background .15s}
.pick-group-h:hover{background:var(--surface-3)}
.pick-group-h .sdot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.pick-group-h b{flex:1;text-transform:capitalize;font-weight:700;font-family:var(--font-display);font-size:13px;letter-spacing:-.01em}
.pick-group-h .cnt{font-size:10.5px;color:var(--text-3);background:var(--surface);padding:2px 8px;border-radius:99px;font-family:"Inter",sans-serif;font-weight:700}
.pick-group-h .cnt.has{color:var(--accent-2);background:var(--accent-glow)}
.pick-group-h .chev{transition:transform .2s;width:14px;height:14px;color:var(--text-3);flex-shrink:0}
.pick-group.open .chev{transform:rotate(180deg)}
.pick-group-body{padding:2px 0 8px;background:var(--surface)}
.pick-opt{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 30px;font-size:12.5px;cursor:pointer;transition:background .12s;line-height:1.4}
.pick-opt:hover{background:var(--surface-2)}
.pick-opt.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pick-opt .cbox{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--border-2);display:grid;place-items:center;flex-shrink:0;transition:all .15s;font-size:10px;line-height:1;color:var(--btn-primary-fg);font-weight:700}
.pick-opt.sel .cbox{background:var(--accent-2);border-color:var(--accent-2)}
.pick-opt .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-opt .ptag{font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--text-3);font-family:"Inter",sans-serif}
.pick-caret{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;flex-shrink:0;color:var(--text-3);cursor:pointer;border-radius:4px;transition:transform .15s var(--ease-out),color .15s,background .15s}
.pick-caret:hover{color:var(--text);background:var(--surface-3)}
.pick-caret-spacer{display:inline-block;width:14px;flex-shrink:0}
.err-detail{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--pri-critical-bd);display:flex;flex-direction:column;gap:10px;transition:border-color .18s var(--ease),background .18s var(--ease)}
.err-detail:hover{border-color:var(--border-2);border-left-color:var(--pri-critical-fg)}
.err-detail>div>div:first-child{font-family:"Inter",sans-serif;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.err-detail>div:nth-child(1)>div:first-child{color:var(--pri-critical-fg)}
.err-detail>div:nth-child(2)>div:first-child{color:#10B981}
.pick-opt.has-children{font-weight:600}
.pick-opt .pname.pick-parent{font-weight:700;letter-spacing:-.01em}
.pick-opt[data-pick]{transition:background .12s}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.theme-sw{border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;cursor:pointer;transition:all .2s var(--ease-out);background:var(--surface)}
.theme-sw:hover{border-color:var(--border-2);transform:translateY(-2px)}
.theme-sw.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.theme-sw .sw{display:flex;gap:4px;margin-bottom:10px}
.theme-sw .sw span{flex:1;height:20px;border-radius:4px}
.theme-sw .tn{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:-.01em}
.theme-sw .td{font-size:10.5px;color:var(--text-3);margin-top:3px;line-height:1.4;font-family:"Inter",sans-serif}
.cal-pop{position:fixed;z-index:500;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,.4);padding:14px;animation:popIn .2s var(--ease-out);width:290px}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-head button{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--text-2);border:1px solid var(--border);background:var(--surface-2);transition:all .15s;font-size:16px}
.cal-head button:hover{background:var(--surface-3);color:var(--text)}
.cal-head b{flex:1;text-align:center;font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:-.01em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:10px;font-weight:700;color:var(--text-3);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.05em;font-family:"Inter",sans-serif}
.cal-day{aspect-ratio:1;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--text-2);display:grid;place-items:center;transition:all .15s;min-height:34px;font-family:"Inter",sans-serif}
.cal-day:hover{background:var(--surface-2);color:var(--text)}
.cal-day.out{opacity:.25}
.cal-day.today{color:var(--text);border:1px solid var(--text-3)}
.cal-day.sel{background:var(--accent);color:var(--btn-primary-fg);border-color:transparent}
.cal-foot{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.cal-foot button{flex:1;padding:8px 10px;font-size:12px;font-weight:600;border-radius:6px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);transition:all .15s;font-family:"Inter",sans-serif;min-height:36px}
.cal-foot button:hover{background:var(--surface-3);color:var(--text)}
#scratch-fab{position:fixed;right:20px;bottom:24px;z-index:80;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--btn-primary-fg);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:all .2s var(--ease);border:1px solid var(--accent)}
#scratch-fab:hover{transform:scale(1.06) rotate(6deg)}
#scratch-fab:active{transform:scale(.94)}
#scratch-fab svg{width:22px;height:22px}
#scratch-drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100vw;background:var(--surface);border-left:1px solid var(--border-2);z-index:180;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s var(--ease-out);box-shadow:-8px 0 40px rgba(0,0,0,.25)}
#scratch-drawer.open{transform:translateX(0)}
#scratch-drawer .sd-head{padding:20px 22px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
#scratch-drawer .sd-head h3{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.02em;flex:1}
#scratch-drawer .sd-body{flex:1;overflow-y:auto;padding:18px 22px}
#scratch-drawer .sd-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:8px}
.sc-add-row{display:flex;gap:8px;margin-bottom:14px}
.sc-add-row .inp{flex:1}
.sc-item{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:var(--r-sm);transition:background .18s;margin-bottom:2px}
.sc-item:hover{background:var(--surface-2)}
.sc-item .cbox{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border-2);display:grid;place-items:center;cursor:pointer;flex-shrink:0;margin-top:1px;transition:all .18s var(--ease-out)}
.sc-item .cbox svg{width:12px;height:12px;opacity:0;transition:opacity .2s;color:var(--btn-primary-fg)}
.sc-item.done .cbox{background:var(--accent-2);border-color:var(--accent-2)}
.sc-item.done .cbox svg{opacity:1}
.sc-item .txt{flex:1;font-size:13.5px;line-height:1.45;background:transparent;border:none;padding:0;color:inherit;resize:none;min-height:20px;font-family:inherit;outline:none;word-break:break-word}
.sc-item.done .txt{color:var(--text-3);text-decoration:line-through}
.sc-item .del{color:var(--text-3);width:24px;height:24px;border-radius:5px;display:grid;place-items:center;opacity:0;transition:opacity .18s;flex-shrink:0}
.sc-item:hover .del{opacity:1}
.sc-item .del:hover{color:#fca5a5;background:rgba(239,68,68,.1)}
.sc-empty{padding:30px 10px;text-align:center;color:var(--text-3);font-size:12.5px;line-height:1.6}
.sc-freeform{width:100%;min-height:100px;margin-top:16px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:13px;line-height:1.6;color:var(--text);resize:vertical}
.sc-freeform:focus{border-color:var(--text-3);outline:none}
#scratch-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:170;opacity:0;pointer-events:none;transition:opacity .25s}
#scratch-backdrop.open{opacity:1;pointer-events:auto}
.contact-card-dash{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,transparent),color-mix(in srgb,var(--accent) 3%,transparent));border:1px solid var(--border-2);border-radius:var(--r);padding:20px 22px;margin-top:20px}
.contact-card-dash .ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.contact-card-dash .ch svg{width:20px;height:20px;color:var(--accent-2)}
.contact-card-dash h3{font-size:15px;font-weight:700;font-family:var(--font-display);letter-spacing:-.01em}
.contact-card-dash p.note{font-size:12.5px;color:var(--text-2);line-height:1.55;margin-bottom:14px}
.contact-links{display:flex;flex-wrap:wrap;gap:8px}
.contact-link{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:600;transition:all .2s;font-family:"Inter",sans-serif;min-height:40px}
.contact-link:hover{background:var(--surface-2);border-color:var(--accent-2);color:var(--accent-2);transform:translateY(-1px)}
.contact-link svg{width:15px;height:15px}
footer.app-foot{margin-top:36px;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-3);flex-wrap:wrap;gap:10px}
.empty{text-align:center;padding:36px 20px;color:var(--text-3)}
.empty .ic{display:grid;place-items:center;margin-bottom:14px;animation:floatIn .6s var(--ease-out)}
@keyframes floatIn{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
.empty b{color:var(--text-2);display:block;font-size:14px;margin-bottom:4px;font-weight:600}
.empty p{font-size:12.5px;line-height:1.5;max-width:340px;margin:0 auto}
.hero-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}

let _uid=0;const uid=p=>p+Date.now().toString(36)+(_uid++).toString(36);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayISO=()=>iso(new Date());
const parseD=s=>{if(!s)return null;const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const d=parseD(s)||new Date();d.setDate(d.getDate()+n);return iso(d);};
const diffD=(a,b)=>Math.round((parseD(a)-parseD(b))/86400000);
const fmtD=s=>{if(!s)return"—";const d=parseD(s);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");};
const fmtDY=s=>{if(!s)return"—";const d=parseD(s);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();};
const relD=s=>{const d=diffD(s,todayISO());if(d===0)return"Today";if(d===1)return"Tomorrow";if(d===-1)return"Yesterday";return d<0?Math.abs(d)+"d overdue":"in "+d+"d";};
const subjColor=s=>{if(SUBJ_COLOR[s])return SUBJ_COLOR[s];let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return PALETTE[Math.abs(h)%PALETTE.length];};
function numPrefix(t){const m=String(t||"").match(/^(\d+)\s*[.\-]/);return m?parseInt(m[1],10):null;}
function sortTopics(items){const hasAnyOrder=items.some(x=>typeof x.order==="number");if(hasAnyOrder){return items.slice().sort((a,b)=>{const ao=typeof a.order==="number"?a.order:999999;const bo=typeof b.order==="number"?b.order:999999;return ao-bo;});}return items.slice().sort((a,b)=>{const an=numPrefix(a.topic),bn=numPrefix(b.topic);if(an!==null&&bn!==null)return an-bn;if(an!==null)return-1;if(bn!==null)return 1;return a.topic.localeCompare(b.topic);});}

  if(s.habits&&typeof s.habits==="object"){const hoursGroup=(s.habitDefs||[]).find(g=>g.type==="hours");Object.keys(s.habits).forEach(date=>{const day=s.habits[date];if(!day||typeof day!=="object")return;if(hoursGroup&&typeof day.hours!=="number"){let h=0;["hi1","hi2","hi3"].forEach((oldId,i)=>{if(day[oldId])h=hoursGroup.thresholds[i]||h;});if(h>0)day.hours=h;}});}
  if(Array.isArray(s.sessions)){s.sessions=s.sessions.map(sess=>{if(typeof sess.interval==="number"&&sess.nextReview!==undefined)return sess;let interval;if(sess.stage==="Mastered"){interval=90;}else{const stageIdx=STAGES.indexOf(sess.stage);interval=stageIdx>=0?(INTERVALS[stageIdx]||1):1;}const ease=2.5;const lastReviewed=sess.lastReviewed||null;const nextReview=lastReviewed?addDays(lastReviewed,interval):todayISO();return Object.assign({},sess,{interval,ease,nextReview,stage:stageFromInterval(interval),history:lastReviewed?[{date:lastReviewed,grade:"good"}]:[]});});}
}

function migrate_12_to_13(s){
  if(s.habits&&typeof s.habits==="object"){
    const hoursGroups=(s.habitDefs||[]).filter(g=>g.type==="hours");
    const thresholds=hoursGroups.length?(hoursGroups[0].thresholds||[]):[];
    Object.keys(s.habits).forEach(date=>{
      const day=s.habits[date];
      if(!day||typeof day!=="object")return;
      if(typeof day.studyMinutes!=="number"){
        let mins=0;
        if(typeof day.hours==="number")mins=Math.round(day.hours*60);
        else{["hi1","hi2","hi3"].forEach((id,i)=>{if(day[id]&&thresholds[i])mins=Math.max(mins,thresholds[i]*60);});}
        day.studyMinutes=mins;
      }
      delete day.hours;
    });
  }
}
function applyIdempotentTransforms(s){
  if(!s.settings)s.settings={};
  if(!Array.isArray(s.settings.exams))s.settings.exams=[];
  if(s.settings.examDate&&!s.settings.exams.length){
    s.settings.exams=[{id:"ex_legacy",label:s.settings.examLabel||"Exam",examTag:"",date:s.settings.examDate,priority:"Primary"}];
  }
  if(!Array.isArray(s.settings.mockSectionSets)||!s.settings.mockSectionSets.length){
    s.settings.mockSectionSets=JSON.parse(JSON.stringify(DEFAULT_MOCK_SECTION_SETS));
  }
  if(Array.isArray(s.mocks)){
    s.mocks.forEach(m=>{
      if(!m.sections||typeof m.sections!=="object")m.sections={};
      if(!m.sectionSet)m.sectionSet="ssc-full";
    });
  }
  if(Array.isArray(s.errors)){
    s.errors.forEach(e=>{
      if(typeof e.interval!=="number")e.interval=0;
      if(typeof e.ease!=="number")e.ease=2.5;
      if(!e.nextReview)e.nextReview=e.date||todayISO();
      if(!e.stage)e.stage="1st Time Study";
      if(!Array.isArray(e.history))e.history=[];
      if(e.lastReviewed===undefined)e.lastReviewed=null;
    });
  }
  if(Array.isArray(s.syllabus)){
    s.syllabus.forEach(t=>{if(t.parentId===undefined)t.parentId=null;});
    const lookup={};
    s.syllabus.forEach(t=>{const k=t.subject+"::"+t.topic;if(!lookup[k])lookup[k]=t.id;});
    s.syllabus.forEach(t=>{
      if(!(t.topic in SYL_PARENT_MAP))return;
      const parentTitle=SYL_PARENT_MAP[t.topic];
      if(parentTitle===null){t.parentId=null;return;}
      if(parentTitle===undefined)return;
      if(t.parentId)return;
      const parentId=lookup[t.subject+"::"+parentTitle];
      if(parentId&&parentId!==t.id)t.parentId=parentId;
    });
  }
}
function migrateState(s){
  if(!s||typeof s!=="object")return s;
  const original=s.schemaVersion||1;
  let from=original;const steps=[];
  if(from<10){migrate_9_to_10(s);from=10;steps.push("→10");}
  if(from<11){migrate_10_to_11(s);from=11;steps.push("→11");}
  if(from<12){migrate_11_to_12(s);from=12;steps.push("→12");}
  if(from<13){migrate_12_to_13(s);from=13;steps.push("→13");}
  s.schemaVersion=SCHEMA_VERSION;
  applyIdempotentTransforms(s);
  if(steps.length)console.log("[Apex] Schema migrated "+original+" "+steps.join(" ")+" (now "+SCHEMA_VERSION+")");
  if(original>SCHEMA_VERSION)console.warn("[Apex] Save is from a NEWER schema ("+original+") than this build ("+SCHEMA_VERSION+").");
  return s;
}

function gradeStats(days){
  const cutoff=addDays(todayISO(),-(days||7));
  const counts={again:0,hard:0,good:0,easy:0,total:0};
  S.sessions.forEach(s=>(s.history||[]).forEach(h=>{
    if(!h.date||h.date<cutoff)return;
    if(counts[h.grade]!==undefined)counts[h.grade]++;
    counts.total++;
  }));
  return counts;
}
function reviewVelocity(){
  const now=todayISO();
  const m30=addDays(now,-30);
  const byDay={};
  S.sessions.forEach(s=>(s.history||[]).forEach(h=>{
    if(!h.date||h.date<m30)return;
    byDay[h.date]=(byDay[h.date]||0)+1;
  }));
  const dates=Object.keys(byDay);

function wirePicker(el){
  const multi=el.dataset.multi==="1",hidden=$("input[type=hidden]",el),search=$(".pick-search",el),list=$(".picker-list",el),chips=$(".pick-chips",el),count=$(".pick-toolbar .count",el);
  const getSel=()=>{try{return JSON.parse(hidden.value);}catch(e){return[];}};
  const expanded={};const initialSel=getSel();if(initialSel.length){const t=topicById(initialSel[0]);if(t)expanded[t.subject]=true;}
  const setSel=a=>{hidden.value=JSON.stringify(a);renderChips();renderList();updateCount();try{el.dispatchEvent(new CustomEvent("pick-change",{bubbles:true}));}catch(e){}};
  const renderChips=()=>{const sel=getSel();chips.innerHTML=sel.map(id=>{const t=topicById(id);if(!t)return"";return'<span class="pill"><i class="dot" style="background:'+subjColor(t.subject)+'"></i><span>'+esc(t.topic)+'</span><span class="x" data-unpick="'+id+'">×</span></span>';}).join("");};
  const updateCount=()=>{const sel=getSel();count.textContent=sel.length?sel.length+" selected":"Tap a subject to open it";};
   const renderList=()=>{
    const q=search.value.toLowerCase().trim(),sel=getSel();
    const groups={};
    S.syllabus.forEach(t=>{if(q){if(t.topic.toLowerCase().indexOf(q)<0&&t.subject.toLowerCase().indexOf(q)<0)return;}(groups[t.subject]=groups[t.subject]||[]).push(t);});
    const order=getSubjectOrder();
    const subs=Object.keys(groups).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return(ia<0?999:ia)-(ib<0?999:ib)||a.localeCompare(b);});
    if(!subs.length){list.innerHTML='<div class="empty" style="padding:24px;text-align:center"><p>No topic matches "'+esc(q)+'"</p></div>';return;}
    list.innerHTML=subs.map(sub=>{
      const items=groups[sub];
      const visIds=new Set(items.map(t=>t.id));
      const containerIds=new Set(items.filter(t=>isRedundantContainer(t.topic,t.subject)).map(t=>t.id));
      const childMap=new Map();
      items.forEach(t=>{
        const isRoot=!t.parentId||!visIds.has(t.parentId)||containerIds.has(t.parentId);
        const key=isRoot?null:t.parentId;
        if(!childMap.has(key))childMap.set(key,[]);
        childMap.get(key).push(t);
      });
      // filter out container rows themselves
      childMap.forEach((arr,k)=>{
        if(k===null)childMap.set(k,arr.filter(t=>!containerIds.has(t.id)));
      });
      childMap.forEach((arr,k)=>{childMap.set(k,sortTopics(arr));});
      const selCount=items.filter(t=>sel.indexOf(t.id)>-1).length;
      const isOpen=q?true:!!expanded[sub];
      const renderTree=(parentId,depth)=>{
        const kids=childMap.get(parentId)||[];
        let html="";
        kids.forEach(t=>{
          const isSel=sel.indexOf(t.id)>-1;
          const kidArr=childMap.get(t.id);
          const hasChildren=!!(kidArr&&kidArr.length);
          const childKey="child_"+t.id;
          const isChildOpen=q?true:!!expanded[childKey];
          const indent=28+depth*16;
          html+='<div class="pick-opt'+(isSel?" sel":"")+(hasChildren?" has-children":"")+'" data-pick="'+t.id+'" style="padding-left:'+indent+'px">';
          if(hasChildren){
            html+='<span class="pick-caret" data-pick-toggle="'+t.id+'" style="transform:rotate('+(isChildOpen?'90':'0')+'deg)"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>';
          }else{
            html+='<span class="pick-caret-spacer"></span>';
          }
          html+='<span class="cbox">'+(isSel?"✓":"")+'</span>';
          html+='<span class="pname'+(hasChildren?' pick-parent':'')+'">'+esc(t.topic)+'</span>';
          if(t.priority){html+='<span class="ptag '+priClass(t.priority)+'">'+esc(t.priority.slice(0,4))+'</span>';}
          html+='</div>';
          if(hasChildren&&isChildOpen){html+=renderTree(t.id,depth+1);}
        });
        return html;
      };
      return '<div class="pick-group'+(isOpen?" open":"")+'">'
        +'<div class="pick-group-h" data-pick-group-h="'+esc(sub)+'"><i class="sdot" style="background:'+subjColor(sub)+'"></i><b>'+esc(sub)+'</b><span class="cnt'+(selCount?" has":"")+'">'+selCount+'/'+items.length+'</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg></div>'
        +(isOpen?'<div class="pick-group-body">'+renderTree(null,0)+'</div>':'')
        +'</div>';
    }).join("");
  };
  search.addEventListener("input",renderList);
  list.addEventListener("click",e=>{const caret=e.target.closest("[data-pick-toggle]");if(caret){e.preventDefault();e.stopPropagation();const id=caret.dataset.pickToggle;expanded["child_"+id]=!expanded["child_"+id];renderList();return;}const groupH=e.target.closest("[data-pick-group-h]");if(groupH){const sub=groupH.dataset.pickGroupH;expanded[sub]=!expanded[sub];renderList();return;}const opt=e.target.closest("[data-pick]");if(!opt)return;const id=opt.dataset.pick,sel=getSel();if(multi){setSel(sel.indexOf(id)>-1?sel.filter(x=>x!==id):sel.concat([id]));}else{setSel([id]);const t=topicById(id);search.value=t?t.topic:"";renderList();}});
  el.addEventListener("click",e=>{const x=e.target.closest("[data-unpick]");if(x){setSel(getSel().filter(i=>i!==x.dataset.unpick));return;}if(e.target.closest("[data-pick-expand]")){S.syllabus.forEach(t=>expanded[t.subject]=true);renderList();return;}if(e.target.closest("[data-pick-collapse]")){Object.keys(expanded).forEach(k=>delete expanded[k]);renderList();return;}});
  renderChips();updateCount();renderList();
}

function dayStats(dISO){
  const dm=S.habits[dISO]||{};
  const studyMins=typeof dm.studyMinutes==="number"?dm.studyMinutes:0;
  let studyGoalMin=0;
  (S.habitDefs||[]).forEach(g=>{
    if(g.type!=="hours")return;
    const top=(g.thresholds||[]).slice(-1)[0]||8;
    studyGoalMin+=top*60;
  });
  const studyCredit=studyGoalMin?Math.min(1,studyMins/studyGoalMin):0;
  let otherDone=0,otherTotal=0;
  (S.habitDefs||[]).forEach(g=>{
    if(g.type==="hours")return;
    if(!Array.isArray(g.items))return;
    otherTotal+=g.items.length;
    g.items.forEach(it=>{if(dm[it.id])otherDone++;});
  });
  const weightedTotal=(studyGoalMin?1:0)+otherTotal;
  const weightedDone=(studyGoalMin?studyCredit:0)+otherDone;
  const pct=weightedTotal?Math.round((weightedDone/weightedTotal)*100):0;
  return{pct,studyMins,studyGoalMin,studyCredit,otherDone,otherTotal};
}
function weekStats(off){
  const start=mondayOf(off===undefined?weekOff:off);
  let studyMins=0,goalMins=0,score=0,days=0;
  for(let i=0;i<7;i++){
    const d=iso(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));
    const s=dayStats(d);
    studyMins+=s.studyMins;
    goalMins+=s.studyGoalMin;
    score+=s.pct;
    days++;
  }
  return{pct:days?Math.round(score/days):0,studyMins,goalMins};
}

function recentSubjectWork(){

    if(!f.topicId||!f.startedAt)return;
    const ts=new Date(f.endedAt||f.startedAt).getTime();
    if(!latest||ts>latest.ts){const t=topicById(f.topicId);if(t)latest={ts,subject:t.subject};}
  });

    if(!s.topicId)return;
    const ts=parseD(s.lastReviewed||s.logDate||"")?.getTime()||0;
    if(!ts)return;

function examUrgencyForTopic(t){

  if(!targets.length){if(!S.settings||!S.settings.examDate)return 0.5;return urgencyFromDays(diffD(S.settings.examDate,todayISO()));}

  const pool=relevant.length?relevant:targets;

  let best=null;

    const d=diffD(x.date,todayISO());

function quickLogParse(text){
  text=String(text||"").trim();
  if(!text)return{topicText:"",minutes:0};
  const m=text.match(/(\d+)\s*(m|min|mins|minutes?|h|hr|hrs|hour|hours)?\s*$/i);
  let minutes=0,topicText=text;
  if(m&&text.length>m[0].length){
    const n=parseInt(m[1],10)||0;
    const unit=(m[2]||"m").toLowerCase();
    minutes=unit.charAt(0)==="h"?Math.min(1440,n*60):Math.min(1440,n);
    topicText=text.slice(0,-m[0].length).trim();
  }
  return{topicText,minutes};
}
function quickLogSuggest(q){
  q=String(q||"").toLowerCase().trim();
  if(!q)return[];
  const scored=[];
  S.syllabus.forEach(t=>{
    const name=t.topic.toLowerCase();
    const subj=t.subject.toLowerCase();
    let score=0;
    if(name===q)score=200;
    else if(name.startsWith(q))score=120;
    else if(name.indexOf(q)>-1)score=70;
    else if(subj.indexOf(q)>-1)score=40;
    else return;
    if(t.status==="Learning")score+=8;
    else if(t.status==="Practicing")score+=5;
    else if(t.status==="Mastered")score-=40;
    if(t.priority==="Critical")score+=3;
    score-=name.length/100;
    scored.push({t,score});
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,6).map(x=>x.t);
}
function quickLogRenderSuggest(q){
  const box=document.querySelector("[data-quicklog-suggest]");
  if(!box)return;
  const matches=quickLogSuggest(q);
  if(!q||!q.trim()){box.innerHTML="";box.classList.remove("on");return;}
  if(!matches.length){box.innerHTML='<div class="ql-empty">No topic matches "'+esc(q)+'"</div>';box.classList.add("on");return;}
  box.innerHTML=matches.map(t=>'<div class="ql-sug-item" data-quicklog-pick="'+t.id+'"><i class="ql-sug-dot" style="background:'+subjColor(t.subject)+'"></i><span class="ql-sug-name">'+esc(t.topic)+'</span><span class="ql-sug-sub">'+esc(t.subject)+'</span></div>').join("");
  box.classList.add("on");
}
function quickLogDo(forcedTopicId){
  const inp=document.querySelector("[data-quicklog-input]");
  if(!inp)return;
  const parsed=quickLogParse(inp.value);
  if(!parsed.topicText&&!forcedTopicId){toast("Type a topic name");return;}
  let t=forcedTopicId?topicById(forcedTopicId):null;
  if(!t){
    const matches=quickLogSuggest(parsed.topicText);
    if(!matches.length){toast("No topic found","Try a different name");return;}
    if(matches.length===1){t=matches[0];}
    else{
      const exact=matches.find(m=>m.topic.toLowerCase()===parsed.topicText.toLowerCase());
      if(exact)t=exact;
      else{quickLogRenderSuggest(parsed.topicText);toast("Multiple matches","Pick one from the list");return;}
    }
  }
  snapshot();
  const now=todayISO();
  S.sessions.push({id:uid("s"),name:t.topic,topicId:t.id,logDate:now,lastReviewed:now,duration:parsed.minutes||0,interval:0,ease:2.5,nextReview:now,stage:"1st Time Study",history:[{date:now,grade:"good"}]});
  saveLocal();
  inp.value="";
  const box=document.querySelector("[data-quicklog-suggest]");
  if(box){box.innerHTML="";box.classList.remove("on");}
  rerender();
  toast("✓ Logged",t.topic+(parsed.minutes?" · "+parsed.minutes+"m":" · no duration"));
}

function renderSylList(){
  const list=sylFiltered();
  const visibleIds=new Set(list.map(t=>t.id));
  const childrenMap=new Map();
  for(let i=0;i<list.length;i++){
    const t=list[i];
    const isRoot=!t.parentId||!visibleIds.has(t.parentId);
    const key=isRoot?null:t.parentId;
    let arr=childrenMap.get(key);
    if(!arr){arr=[];childrenMap.set(key,arr);}
    arr.push(t);
  }
  const roots=(childrenMap.get(null)||[]).slice();
  const containerIds=new Set();
  for(const t of roots){
    if(isRedundantContainer(t.topic,t.subject))containerIds.add(t.id);
  }
  if(containerIds.size){
    for(let i=0;i<list.length;i++){
      const t=list[i];
      if(t.parentId&&containerIds.has(t.parentId)){
        let nullArr=childrenMap.get(null);
        if(!nullArr){nullArr=[];childrenMap.set(null,nullArr);}
        nullArr.push(t);
      }
    }
    const newRoots=(childrenMap.get(null)||[]).filter(t=>!containerIds.has(t.id));
    childrenMap.set(null,newRoots);
  }
  childrenMap.forEach((arr,k)=>{childrenMap.set(k,sortTopics(arr));});
  const focusMap=new Map();(S.focusLog||[]).forEach(f=>{if(f.topicId)focusMap.set(f.topicId,(focusMap.get(f.topicId)||0)+(f.minutes||0));});
  const groups={};for(let i=0;i<list.length;i++){const t=list[i];(groups[t.subject]=groups[t.subject]||[]).push(t);}
  const order=getSubjectOrder();
  const subs=Object.keys(groups).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return(ia<0?999:ia)-(ib<0?999:ib)||a.localeCompare(b);});
  const el=$("#syl-list");if(!el)return;
  let out="";
  for(let si=0;si<subs.length;si++){
    const sub=subs[si];const allInSub=groups[sub];const totalCount=allInSub.length;
    let doneCount=0,sumPct=0;for(let i=0;i<allInSub.length;i++){if(allInSub[i].status==="Mastered")doneCount++;sumPct+=statusPct(allInSub[i].status);}
    const avg=totalCount?Math.round(sumPct/totalCount):0;
    const closed=sf.closed[sub];const orderIdx=order.indexOf(sub);const isFirst=orderIdx<=0,isLast=orderIdx>=order.length-1;
    const subjectIds=new Set(allInSub.map(t=>t.id));
    const subMap=new Map();
    subMap.set(null,(childrenMap.get(null)||[]).filter(t=>t.subject===sub));
    childrenMap.forEach((arr,k)=>{
      if(k===null)return;
      const filtered=arr.filter(t=>subjectIds.has(t.id));
      if(filtered.length)subMap.set(k,filtered);
    });
    const renderTreeSub=(pid,depth)=>{
      const kids=subMap.get(pid);if(!kids||!kids.length)return"";
      let html="";
      for(let i=0;i<kids.length;i++){const t=kids[i];const childArr=subMap.get(t.id);const hasChildren=!!(childArr&&childArr.length);const isCollapsed=!!sf.closedTopics[t.id];html+=topicRow(t,depth,hasChildren,isCollapsed,childArr?childArr.length:0,focusMap.get(t.id)||0);if(hasChildren&&!isCollapsed)html+=renderTreeSub(t.id,depth+1);}
      return html;
    };
    const bodyHTML=closed?"":renderTreeSub(null,0);
    out+='<div class="subj-group'+(closed?" closed":"")+'" data-subj="'+esc(sub)+'"><div class="subj-head" data-action="toggle-subj" data-id="'+esc(sub)+'"><i class="sdot" style="background:'+subjColor(sub)+'"></i><b>'+esc(sub)+'</b><span class="cnt">'+doneCount+'/'+totalCount+'</span><div class="pbar"><div class="pfill" style="width:'+avg+'%;background:'+subjColor(sub)+'"></div></div><span class="tiny">'+avg+'%</span><div class="subj-actions"><button class="mini-icon" data-action="subj-up" data-id="'+esc(sub)+'" title="Move up" '+(isFirst?"disabled":"")+'>'+ICONS.up+'</button><button class="mini-icon" data-action="subj-down" data-id="'+esc(sub)+'" title="Move down" '+(isLast?"disabled":"")+'>'+ICONS.down+'</button><button class="mini-icon danger" data-action="del-subject" data-id="'+esc(sub)+'" title="Delete subject">'+ICONS.trash+'</button></div><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg></div><div class="subj-body">'+bodyHTML+'</div></div>';
  }
  el.innerHTML=out||'<div class="empty"><div class="ic">'+emptyArt("search")+'</div><b>No topics match</b><p>Clear a filter or search term.</p></div>';
  const c=$("#syl-count");if(c)c.textContent=list.length+" of "+S.syllabus.length+" topics";
}

      if(e.recallPct>=75)read=minHrs<=2?"cheap — strong recall on low investment":"strong recall — investment is paying off";
      else if(e.recallPct>=55)read=minHrs>=5?"expensive — middling recall on high investment":"middling recall — worth another pass";
      else read=minHrs>=4?"expensive — weak recall on high investment — change approach":"weak recall — keep investing, it hasn't stuck yet";
      paired=" · "+read;
    }
    rows.push('<div style="display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border)"><span style="font-size:12.5px;color:var(--text-2)">Investment</span><span><b>'+fmtMin(e.totalMin)+'</b> <span class="tiny">· '+bd+paired+'</span></span></div>');
  }else if(e.sessCount>0){
    rows.push('<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span style="font-size:12.5px;color:var(--text-2)">Investment</span><span class="tiny">'+e.sessCount+' session'+(e.sessCount===1?"":"s")+' · no duration logged</span></div>');
  }
  const vColor=e.verdictClass==="good"?"#10B981":e.verdictClass==="bad"?"#EF4444":"var(--text-2)";
  rows.push('<div style="padding:10px 0 2px;font-size:12.5px;color:'+vColor+';font-weight:600">'+esc(e.verdict)+'</div>');
  return '<div class="detail-block" style="border-left:2px solid var(--accent-2)"><h5>Effectiveness</h5>'+rows.join("")+'</div>';
}

e)+'</span></div>').join(""):'<div class="tiny" style="padding:6px 8px">No errors logged</div>')+'<button class="btn ghost sm" style="margin-top:8px" data-action="error-for-topic" data-id="'+t.id+'">+ Log error</button></div><div class="detail-block"><h5>Mock weak tags<span class="cnt">'+mocks.length+'</span></h5>'+(mocks.length?mocks.map(m=>'<div class="detail-row"><span style="flex:1;min-width:0">'+esc(m.title)+'</span><span class="tiny">'+fmtD(m.date)+'</span></div>').join(""):'<div class="tiny" style="padding:6px 8px">Not tagged</div>')+'</div>'+effectivenessBlockHTML(id)
+(t.remarks?'<div class="detail-block"><h5>Remarks</h5><div class="tiny" style="padding:4px 8px;white-space:pre-wrap">'+esc(t.remarks)+'</div></div>':"");openModal(t.topic,body,()=>{},"Done");}

      +'<div class="detail-block"><h5>Spaced repetition, in one paragraph</h5><div class="tiny" style="line-height:1.7;color:var(--text-2)">When you first study a topic, we schedule it for tomorrow. If you rate it <b>Good</b>, the next interval grows (typically ×2.5). If you rate <b>Hard</b>, it grows slowly. If you rate <b>Again</b>, it resets to 1 day. This is how the algorithm learns <i>your</i> forgetting curve. The goal: see each topic right before you would forget it. Not too early (wasted review), not too late (forgotten).</div></div>'

      +'<div class="detail-block"><h5>Exam targets & D-Day</h5><div class="tiny" style="line-height:1.7;color:var(--text-2)">Add every exam you\'re preparing for in <b>Settings → Exam targets</b>. Give each one a label, a date, a priority (Primary / Secondary / Backup), and — most importantly — an <b>exam tag</b> that matches your syllabus topics (CGL, CHSL, RBI). The D-Day banner on Home shows your nearest Primary target as the hero number, with all others as chips below. The smart engine uses the same targets: a topic tagged <b>CGL</b> inherits urgency from the nearest exam whose tag is <b>CGL</b>, scaled by that exam\'s priority. So a Critical CGL topic at D-15 correctly beats a Medium CHSL topic at D-90.</div></div>'

    +'<div class="card section-gap"><div class="card-h"><h2>Pro tips</h2></div>'

data-id="'+t.id+'">⚡</button></div>';}).join("")+'</div>':'<div class="empty"><div class="ic">'+emptyArt("radar")+'</div><b>Nothing flagged</b><p>Log errors and mock weak areas to build your radar.</p></div>')+'</div>';}
let rtab="all";
function viewReviews(){return'<div class="hero-head"><div><h2>Spaced <span style="font-style:italic">Repetition</span></h2><div class="sub">Adaptive · rate Again / Hard / Good / Easy. Mastered → +90d → +180d → +365d.</div></div><button class="btn primary" style="margin-left:auto" data-action="open-add-session">'+ICONS.plus+' Log Session</button></div><div class="page-tabs" id="rtabs"></div><div id="sess-list" style="display:grid;gap:14px"></div>';}
function rtabCount(k){if(k==="today")return dueSessions().length+dueErrors().length;if(k==="upcoming")return S.sessions.filter(s=>{const r=reviewState(s);return r.st==="future"&&r.days<=7;}).length;if(k==="mastered")return S.sessions.filter(s=>s.stage==="Mastered").length;return S.sessions.length;}

function renderSessList(){const el=$("#sess-list");if(!el)return;let html="";if(rtab==="today"){const due=dueSessions();const dueErr=dueErrors();const combined=[];dueErr.forEach(e=>combined.push({kind:"error",item:e,r:reviewState(e)}));due.forEach(s=>combined.push({kind:"session",item:s,r:reviewState(s)}));combined.sort((a,b)=>{const da=a.r.st==="overdue"?-a.r.days-1000:(a.r.st==="new"?-500:0);const db=b.r.st==="overdue"?-b.r.days-1000:(b.r.st==="new"?-500:0);return da-db;});html=combined.length?combined.map(u=>u.kind==="error"?errorCard(u.item):sessCard(u.item)).join(""):'<div class="empty"><div class="ic">'+emptyArt("check")+'</div><b>All clear</b><p>Nothing due today.</p></div>';}else if(rtab==="upcoming"){const up=S.sessions.filter(s=>{const r=reviewState(s);return r.st==="future"&&r.days<=7;}).sort((a,b)=>{const x=reviewState(a).nr,y=reviewState(b).nr;return x<y?-1:1;});if(!up.length)html='<div class="empty"><div class="ic">'+emptyArt("cal")+'</div><b>Nothing this week</b></div>';else{let cur="";html=up.map(s=>{const nr=reviewState(s).nr;let head="";if(nr!==cur){cur=nr;head='<div class="date-grp"><div class="date-grp-h">'+fmtD(nr)+' · '+relD(nr)+'</div></div>';}return head+sessCard(s);}).join("");}}else if(rtab==="mastered"){const m=S.sessions.filter(s=>s.stage==="Mastered");html=m.length?m.map(sessCard).join(""):'<div class="empty"><div class="ic">'+emptyArt("check")+'</div><b>Nothing mastered yet</b></div>';}else{const all=S.sessions.slice().sort((a,b)=>{const ra=reviewState(a),rb=reviewState(b);if(!ra.nr)return 1;if(!rb.nr)return-1;return ra.nr<rb.nr?-1:1;});html=all.length?all.map(sessCard).join(""):'<div class="empty"><div class="ic">'+emptyArt("book")+'</div><b>No sessions yet</b><p>Log your first study session to start the repetition cycle.</p></div>';}el.innerHTML=html;}

function sessionModal(s,prefillTopicId){openModal(s?"Edit Session":"Log Study Session",'<div class="frow"><label>Session name</label><input class="inp" name="name" value="'+esc(s?s.name:"")+'" placeholder="e.g. Percentage PYQs — Kiran"></div><div class="frow"><label>Linked topic</label>'+pickerHTML("topicIds",s&&s.topicId?[s.topicId]:(prefillTopicId?[prefillTopicId]:[]),false)+'</div><div class="f2"><div class="frow"><label>Log date</label>'+dateFieldHTML("logDate",(s&&s.logDate)||todayISO())+'</div><div class="frow"><label>Last reviewed</label>'+dateFieldHTML("lastReviewed",(s&&s.lastReviewed)||todayISO())+'</div></div><div class="frow"><label>Duration (optional)</label><input class="inp" type="number" min="0" max="1440" step="5" name="duration" value="'+((s&&s.duration)||"")+'" placeholder="minutes" data-noclear><div class="chips" style="margin-top:8px" id="dur-chips">'+[15,30,45,60,90,120].map(m=>'<button type="button" class="chip'+(s&&s.duration===m?" on":"")+'" data-dur="'+m+'" style="padding:6px 12px;min-height:32px;font-size:12px">'+m+'m</button>').join("")+'</div><div id="focus-dur-hint" style="display:none;margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--pri-medium-bg);border:1px solid var(--pri-medium-bd);color:var(--pri-medium-fg);font-size:11.5px;line-height:1.5"></div><div class="hint">Skip if you don\'t track time.</div></div>',v=>{if(!v.name){toast("⚠️ Name required");return false;}const ids=pickVals(v.topicIds);const dur=Math.max(0,Math.min(1440,parseInt(v.duration,10)||0));const base={name:v.name,topicId:ids[0]||null,logDate:v.logDate||null,lastReviewed:v.lastReviewed||null,duration:dur};if(s)Object.assign(s,base);else{const fresh=Object.assign({id:uid("s"),interval:0,ease:2.5,nextReview:v.lastReviewed||todayISO(),stage:"1st Time Study",history:v.lastReviewed?[{date:v.lastReviewed,grade:"good"}]:[]},base);S.sessions.push(fresh);}edit(()=>{});toast(s?"Session updated":"Session logged");},s?"Save":"Log");
  const picker=document.querySelector('.modal .tpick');

function validateImport(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return"Not an object";
  if(!Array.isArray(d.syllabus))return"Missing 'syllabus' array";
  for(let i=0;i<d.syllabus.length;i++){
    const t=d.syllabus[i];
    if(!t||typeof t!=="object")return"syllabus["+i+"] not an object";
    if(typeof t.id!=="string")return"syllabus["+i+"].id missing";
    if(typeof t.topic!=="string")return"syllabus["+i+"].topic missing";
    if(typeof t.subject!=="string")return"syllabus["+i+"].subject missing";
  }
  const arrKeys=["sessions","errors","mocks","tasks","links","focusLog"];
  for(const k of arrKeys){
    if(d[k]===undefined)continue;
    if(!Array.isArray(d[k]))return"'"+k+"' must be an array";
    for(let i=0;i<d[k].length;i++){
      const item=d[k][i];
      if(!item||typeof item!=="object")return k+"["+i+"] not an object";
      if(typeof item.id!=="string")return k+"["+i+"].id missing";
    }
  }
  if(d.habits!==undefined){
    if(typeof d.habits!=="object"||Array.isArray(d.habits))return"'habits' must be an object";
    for(const date of Object.keys(d.habits)){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return"habits key '"+date+"' not a valid date";
      const day=d.habits[date];
      if(!day||typeof day!=="object"||Array.isArray(day))return"habits['"+date+"'] not an object";
    }
  }
  if(d.habitDefs!==undefined&&!Array.isArray(d.habitDefs))return"'habitDefs' must be an array";
  if(d.settings!==undefined&&(typeof d.settings!=="object"||Array.isArray(d.settings)))return"'settings' must be an object";
  return null;
}
function mergeStates(base,incoming){
  const out=JSON.parse(JSON.stringify(base));
  const mergeArr=(key,idField)=>{
    if(!Array.isArray(incoming[key]))return;
    if(!Array.isArray(out[key]))out[key]=[];
    const seen=new Set(out[key].map(x=>x&&x[idField]));
    incoming[key].forEach(item=>{if(item&&!seen.has(item[idField]))out[key].push(item);});
  };
  mergeArr("syllabus","id");
  mergeArr("sessions","id");
  mergeArr("errors","id");
  mergeArr("mocks","id");
  mergeArr("tasks","id");
  mergeArr("links","id");
  mergeArr("focusLog","id");
  mergeArr("scratch","id");
  if(incoming.habits&&typeof incoming.habits==="object"){
    if(!out.habits||typeof out.habits!=="object")out.habits={};
    Object.keys(incoming.habits).forEach(date=>{
      if(!out.habits[date]){out.habits[date]=incoming.habits[date];return;}
      const day=incoming.habits[date];
      if(!day||typeof day!=="object")return;
      Object.keys(day).forEach(k=>{
        if(out.habits[date][k]===undefined)out.habits[date][k]=day[k];
      });
    });
  }
  return out;
}

  if(!location.hash){try{history.replaceState(null,"","#/dashboard");}catch(err){}}
  renderRoute();
  updateTimerUI();updateSyncPill();updateUndoBtn();
  if(!S.settings.welcomeDone)setTimeout(welcomeOverlay,200);
  if(S.sync.enabled&&S.sync.room&&FBCFG.apiKey){const cached=sessionStorage.getItem("apex-sync-pass");if(cached){setPassphrase(cached).then(()=>startSync()).catch(()=>setSyncStatus("locked"));}else{setSyncStatus("locked");}}
}catch(err){fatal("Startup: "+err.message);}
(function cleanupLegacyKeys(){
  try{
    store.set(KEY,JSON.stringify(S));
    let freed=0,removed=[];
    (OLD_KEYS||[]).forEach(k=>{
      if(k===KEY)return;
      const v=localStorage.getItem(k);
      if(v){freed+=v.length;localStorage.removeItem(k);removed.push(k);}
    });
    if(removed.length){const kb=Math.round(freed/1024);console.log("[Apex] Cleaned "+removed.length+" legacy keys ("+removed.join(", ")+"), freed ~"+kb+" KB");}
    else{console.log("[Apex] No legacy keys to clean.");}
  }catch(e){console.warn("[Apex] Cleanup skipped:",e.message);}
})();
</script>
